name: Lesson 1 - Plan Generation
on:
  push:
    paths:
      - '.rokct/agent/jobs/pending/*.md'
    branches:
      - main
  schedule:
    - cron: '45 * * * *' # Hourly, offset from book Level 1
  workflow_dispatch:

jobs:
  generate_plan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      session_id: ${{ steps.delegate_task.outputs.session_id }}
      card_id: ${{ steps.delegate_task.outputs.card_id }}
      card_type: ${{ steps.delegate_task.outputs.card_type }}
      card_theme: ${{ steps.delegate_task.outputs.card_theme }}
      card_file: ${{ steps.delegate_task.outputs.card_file }}
    steps:
      - uses: actions/checkout@v4

      - name: Initiate Protocol
        run: |
          if [ -f ".rokct/initiate.py" ]; then
            echo "🚀 Running local initiate.py..."
            python .rokct/initiate.py
          else
            echo "🌐 Fetching web initiate.py from remote protocol..."
            curl -sSL https://raw.githubusercontent.com/RokctAI/The-Rokct-Protocol/main/profiles/web/initiate.py -o initiate_temp.py
            python initiate_temp.py
            rm initiate_temp.py
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Identify Oldest Lesson Card and Claim Lock
        id: delegate_task
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          MONOREPO_PAT: ${{ secrets.MONOREPO_PAT }}
        run: |
          # Find the first lesson.* card with status: theme_generated.
          # Alphabetical order: mtimes are all checkout-time in CI, so
          # 'ls -rt' was nondeterministic, not oldest-first.
          ALL_CARDS=$(ls -1 .rokct/agent/jobs/pending/*.md 2>/dev/null | grep -v 'template' || true)

          FILE=""
          for f in $ALL_CARDS; do
            TYPE=$(grep '^type:' "$f" | cut -d':' -f2 | xargs)
            case "$TYPE" in lesson.*) ;; *) continue ;; esac
            STATUS=$(grep '^status:' "$f" | cut -d':' -f2 | xargs)
            if [ "$STATUS" == "theme_generated" ]; then
              FILE="$f"
              break
            fi
          done

          if [ -z "$FILE" ]; then
            echo "ℹ️ No lesson cards pending plan generation found."
          else
            ID=$(grep '^id:' "$FILE" | cut -d':' -f2 | xargs)
            TYPE=$(grep '^type:' "$FILE" | cut -d':' -f2 | xargs)
            THEME=$(grep '^theme:' "$FILE" | cut -d':' -f2- | xargs)

            # Claim Job Lock
            if ! python .rokct/skills/agent_delegation/scripts/lock_job.py --file "$FILE" --action claim --agent "groq" --session "GS-LESSON-PLAN-$GITHUB_RUN_ID"; then
              echo "Card $FILE is locked by another session. Skipping."
              exit 0
            fi

            # Set outputs up front so Handle Failure has context
            echo "card_id=$ID" >> "$GITHUB_OUTPUT"
            echo "card_type=$TYPE" >> "$GITHUB_OUTPUT"
            echo "card_theme=$THEME" >> "$GITHUB_OUTPUT"
            echo "card_file=$FILE" >> "$GITHUB_OUTPUT"

            echo "🚀 Requesting Lesson Plan from Groq for $ID..."

            if ! PROMPT=$(python lessons/scripts/lesson_pipeline.py prompt --file "$FILE" --level 1 2>&1); then
              echo "❌ Prompt construction failed:"
              echo "$PROMPT"
              exit 1
            fi

            if RESPONSE=$(python .rokct/skills/agent_delegation/scripts/call_groq.py groq --prompt "$PROMPT" 2>&1) && [ -n "$RESPONSE" ] && [[ ! "$RESPONSE" == *"Error:"* ]]; then
              echo "✅ Groq responded. Updating card..."
            else
              echo "❌ Groq call failed: $(echo "$RESPONSE" | tail -n 2)"
              exit 1
            fi

            if ! python lessons/scripts/lesson_pipeline.py plan --file "$FILE" --content "$RESPONSE"; then
              echo "❌ Plan parse failed. Raw Groq response follows:"
              echo "$RESPONSE" | head -30
              exit 1
            fi

            python .rokct/skills/agent_delegation/scripts/update_status.py --file "$FILE" --status pending_approval --agent groq
            python .rokct/skills/agent_delegation/scripts/lock_job.py --file "$FILE" --action release

            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add "$FILE" .rokct/agent/log/transitions.log
            git commit -m "🤖 [CI] Lesson 1: Plan captured for $ID [skip ci]"
            for i in 1 2 3; do
              git push origin main && break
              git pull --rebase origin main || { git rebase --abort || true; exit 1; }
              sleep $((RANDOM % 3 + 1))
            done

            echo "session_id=GROQ-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Handle Failure
        if: failure() && steps.delegate_task.outputs.card_file != ''
        run: |
          CARD_FILE="${{ steps.delegate_task.outputs.card_file }}"
          ATTEMPTS=$(grep '^attempts:' "$CARD_FILE" | cut -d':' -f2 | xargs)
          NEW_ATTEMPTS=$((ATTEMPTS + 1))
          sed -i "s/^attempts: .*/attempts: $NEW_ATTEMPTS/" "$CARD_FILE"
          sed -i "s/^last_error: .*/last_error: ${{ github.run_id }} failed at $(date -u)/" "$CARD_FILE"

          echo "[$(date -u +'%Y-%m-%d %H:%M:%S')] ${{ steps.delegate_task.outputs.card_id }} | Lesson 1 | ${{ github.run_id }} | Agent call failed" >> .rokct/agent/log/errors.log

          if [ "$NEW_ATTEMPTS" -ge 3 ]; then
            echo "3 attempts failed. Marking as stalled."
            python .rokct/skills/agent_delegation/scripts/update_status.py \
              --file "$CARD_FILE" \
              --status stalled
          else
            echo "Attempt $NEW_ATTEMPTS failed. Will retry on next scheduled run."
            python .rokct/skills/agent_delegation/scripts/lock_job.py \
              --file "$CARD_FILE" \
              --action release
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CARD_FILE" .rokct/agent/log/errors.log
          git commit -m "fail: recorded error for ${{ steps.delegate_task.outputs.card_id }} [skip ci]"
          for i in 1 2 3; do
            git push origin main && break
            git pull --rebase origin main || { git rebase --abort || true; exit 1; }
            sleep $((RANDOM % 3 + 1))
          done

  update_ledger:
    needs: generate_plan
    if: needs.generate_plan.outputs.session_id != ''
    uses: ./.github/workflows/ledger_update.yml
    with:
      id: ${{ needs.generate_plan.outputs.card_id }}
      type: ${{ needs.generate_plan.outputs.card_type }}
      theme: ${{ needs.generate_plan.outputs.card_theme }}
      status: "pending_approval"
      agent: "groq"
      session: ${{ needs.generate_plan.outputs.session_id }}
    secrets: inherit
