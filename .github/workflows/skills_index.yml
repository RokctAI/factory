name: Skills Index

# Rebuilds lessons/skills_index.json — the skill_ref lookup behind the
# Supacharge NON-FORCING skill suggestions and the Library's skills shelf,
# generated from the per-skill CAPS files (the source of truth for skill
# content). The file is POSTed to the rlms backend's publish_skills_index
# endpoint and parsed by lms_sdk's SkillLessonIndex.parse (the authored
# review sets ride the same entries for BackendSkillReviewSource), so it
# must never go stale relative to the skills tree. Runs whenever skill
# content changes on main. Mirrors knowledge_bites_index.yml.
#
# Loop guard: the trigger paths cover only the skills tree and the build
# script — the generated lessons/skills_index.json sits outside them, so
# this workflow's own bot commit never re-triggers it. The build script
# additionally only rewrites the file when content other than generated_at
# changed, and the commit step is a no-op on no diff.
#
# The publish step needs the RLMS_SITE_URL / RLMS_API_KEY / RLMS_API_SECRET
# repository secrets (a System-Manager API token on the rlms site). Until
# they are configured the step skips cleanly and the workflow only keeps
# the committed index fresh.

on:
  push:
    branches:
      - main
    paths:
      - 'lessons/curriculum/CAPS/*/skills/**'
      - 'lessons/scripts/CAPS/build_skills_index.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skills-index
  cancel-in-progress: false

jobs:
  build_index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build skills index
        run: python3 lessons/scripts/CAPS/build_skills_index.py

      - name: Commit index if changed
        run: |
          if git diff --quiet -- lessons/skills_index.json; then
            echo "skills_index.json unchanged; nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lessons/skills_index.json
            git commit -m "[CI] Rebuild skills index"
            git push
          fi

      - name: Publish to rlms backend
        env:
          RLMS_SITE_URL: ${{ secrets.RLMS_SITE_URL }}
          RLMS_API_KEY: ${{ secrets.RLMS_API_KEY }}
          RLMS_API_SECRET: ${{ secrets.RLMS_API_SECRET }}
        run: |
          if [ -z "$RLMS_SITE_URL" ]; then
            echo "RLMS_SITE_URL secret not configured; skipping backend publish"
            exit 0
          fi
          python3 lessons/scripts/CAPS/build_skills_index.py --publish
