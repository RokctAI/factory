# Engine copy of factory's practice_bank.yml: runs against RokctAI/lessons (checked out at the
# workspace root with MONOREPO_PAT). Generated by split/split.py; see split/README.md.
name: Practice Bank

# Rebuilds school/practice_bank.json — the pre-authored practice item bank
# behind the Supacharge adaptive practice queue (product log #42 item 2).
# The file is POSTed to the rlms backend's publish_practice_bank endpoint
# and selected server-side by practice_rules, so it must never go stale
# relative to the session lesson tree's mcq.json files. Runs whenever
# session lesson content changes on main. Mirrors knowledge_bites_index.yml.
#
# Loop guard: the trigger paths cover only the session lesson tree and the
# build script — the generated school/practice_bank.json sits outside
# them, so this workflow's own bot commit never re-triggers it. The build
# script additionally only rewrites the file when content other than
# generated_at changed, and the commit step is a no-op on no diff.
#
# The publish step needs the RLMS_SITE_URL / RLMS_API_KEY / RLMS_API_SECRET
# repository secrets (a System-Manager API token on the rlms site). Until
# they are configured the step skips cleanly and the workflow only keeps
# the committed bank fresh.
#
# Past papers (matric exam prep): the extracted Grade 12 DBE NSC papers
# under school/curriculum/CAPS/past_papers/<subject>/grade12/<year>[_mayjune]/
# paperN.json are written into the bank's separate `past_papers` map (open
# answer + memo + attribution, never MCQs), so a new or corrected paper
# rebuilds and republishes the bank too. The generated bank sits outside
# that path, so the loop guard above still holds.
#
# IEB overlay items (the ~ieb practice ids under each shared lesson's
# overlays/IEB/mcq.json) are included: the rlms practice_queue filters the
# bank to each learner's curriculum (agent #301), so a CAPS learner never
# sees them. Items marked needs_reauthor stay withheld by the builder.

env:
  ROKCT_PRACTICE_OVERLAY_CURRICULA: IEB

on:
  workflow_dispatch:
    inputs:
      router_before:
        description: 'Set by content_router: start of the pushed range. Leave empty when running by hand.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: practice-bank
  cancel-in-progress: false

jobs:
  build_bank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RokctAI/lessons
          token: ${{ secrets.MONOREPO_PAT }}

      - name: Build practice bank
        run: python3 school/scripts/CAPS/build_practice_bank.py

      - name: Commit bank if changed
        run: |
          if git diff --quiet -- school/practice_bank.json; then
            echo "practice_bank.json unchanged; nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # Another workflow can push to main while the bank builds, so
            # rebuild on the latest main and retry instead of failing.
            for attempt in 1 2 3 4; do
              git add school/practice_bank.json
              git commit -m "[CI] Rebuild practice bank"
              if git push; then exit 0; fi
              git fetch origin main
              git reset --hard origin/main
              python3 school/scripts/CAPS/build_practice_bank.py
              if git diff --quiet -- school/practice_bank.json; then
                echo "practice_bank.json already current on main"; exit 0
              fi
              sleep $((attempt * 5))
            done
            exit 1
          fi

      - name: Publish to rlms backend
        env:
          RLMS_SITE_URL: ${{ secrets.RLMS_SITE_URL }}
          RLMS_API_KEY: ${{ secrets.RLMS_API_KEY }}
          RLMS_API_SECRET: ${{ secrets.RLMS_API_SECRET }}
        run: |
          if [ -z "$RLMS_SITE_URL" ]; then
            echo "RLMS_SITE_URL secret not configured; skipping backend publish"
            exit 0
          fi
          python3 school/scripts/CAPS/build_practice_bank.py --publish
