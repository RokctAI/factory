name: Privacy Check
on:
  push:
    paths:
      - '.rokct/agent/jobs/pending/*.md'
  pull_request:
    paths:
      - '.rokct/agent/jobs/pending/*.md'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initiate Protocol
        run: |
          if [ -f ".rokct/initiate.py" ]; then
            echo "🚀 Running local initiate.py..."
            python .rokct/initiate.py
          else
            echo "🌐 Fetching web initiate.py from remote protocol..."
            curl -sSL https://raw.githubusercontent.com/RokctAI/The-Rokct-Protocol/main/profiles/web/initiate.py -o initiate_temp.py
            python initiate_temp.py
            rm initiate_temp.py
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install python-dotenv pycryptodome

      - name: Run Privacy Enforcement Check
        run: |
          python .rokct/skills/agent_delegation/scripts/privacy_sync.py --check
