# Engine copy of factory's level6a_visual_summary.yml: runs against RokctAI/books (checked out at the
# workspace root with MONOREPO_PAT). Generated by split/split.py; see split/README.md.
name: Level 6a - Visual Summary
on:
  workflow_dispatch:
    inputs:
      router_before:
        description: 'Set by content_router: start of the pushed range. Leave empty when running by hand.'
        required: false
        default: ''
jobs:
  summarize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RokctAI/books
          token: ${{ secrets.MONOREPO_PAT }}

      - name: Initiate Protocol
        run: |
          if [ -f ".rokct/initiate.py" ]; then
            echo "🚀 Running local initiate.py..."
            python .rokct/initiate.py
          else
            echo "🌐 Fetching web initiate.py from remote protocol..."
            curl -sSL https://raw.githubusercontent.com/RokctAI/The-Rokct-Protocol/main/profiles/web/initiate.py -o initiate_temp.py
            python initiate_temp.py
            rm initiate_temp.py
          fi

      - name: Identify Book and Trigger Summary
        run: |
          FILES=$(git diff --name-only ${{ inputs.router_before || 'HEAD~1' }} HEAD | grep 'books/drafts/.*/metadata.md' || true)
          for FILE in $FILES; do
            STATUS=$(grep '^status:' "$FILE" | cut -d':' -f2 | xargs)
            VISUALS=$(grep '^visuals_status:' "$FILE" | cut -d':' -f2 | xargs)
            if [ "$STATUS" == "publishing" ] && [ "$VISUALS" == "pending" ]; then
              ID=$(grep '^id:' "$FILE" | cut -d':' -f2 | xargs)
              echo "🚀 Triggering Visual Summary for $ID..."
              python .rokct/skills/agent_delegation/scripts/call_jules.py create \
                --repo "sources/github/RokctAI/books" \
                --prompt "TASK: Read the entire folder for book '$ID'. Summarize emotional world, dominant themes, recurring images, tone, target feeling, and age guardrail. Save to visuals/book_summary.md inside the book folder. Then update visuals_status to 'summarizing' via update_status.py." \
                --title "Level 6a: Visual Summary - $ID"
            fi
          done
