name: Face pack

# Team members' talking-face pictures for the app (no video): per member one
# shared set of mouth pictures, a base picture and eye pictures, plus a small
# timing file per greeting / sign-off (tutors) or intro / sign-off / handover
# line (hosts). The app shows these full screen while the line's audio plays.
# Code: talking_head/ (still-head LivePortrait, MuseTalk lips, GFPGAN mouth
# sharpening, face_pack.py, pack_persona.py). CPU only.
#
# Each line is drawn from the member's own voice (~20 min per line on CPU),
# so the mouth follows exactly what they say. A member with no voice yet gets
# pictures only: their portrait speaks a few lines in a stand-in voice and no
# timing files are kept (Ray, 2026-11-23: the app plays a lesson only once all
# its audio exists). Run them again once their voice exists. Timing real lines
# against stand-in pictures was tried and looked wrong (Ray, 2026-11-20).
# One pack per style: 'clear' (Grade R-3, wider mouth) and 'normal' are separate
# (Ray, 2026-11-20).
#
# Portraits and line text come from agent (read-only); voice audio from the
# voice repo, which is only read. Each member's pack is pushed straight to the
# voice repo next to their voices (voices/team/<kind>/CAPS/<persona>/face/<style>/)
# on one rokct/faces-<style>-<run> branch, and the run opens one pull request.
# No artifacts: on this public repo they would publish members' faces. Logs carry names, counts and sizes only, never
# line text: this repo is public.
# A PR touching talking_head/ makes tutor_001's pack from their first greeting
# and reports its size only (nothing is kept).

on:
  workflow_dispatch:
    inputs:
      personas:
        description: 'Team members, comma-separated (tutor_001,assistant_005), or "all" = every member with a portrait'
        default: 'tutor_001'
      style:
        description: 'Mouth style: normal (Grade 4-12, hosts) or clear (Grade R-3: wider, rounder, held longer)'
        type: choice
        options: [normal, clear]
        default: normal
      standin:
        description: 'For members with no voice yet: stand-in lines that draw their pictures, as <persona>:<line>,<line>'
        default: 'tutor_001:greetings/01,greetings/02,greetings/03,signoffs/01'
      lines:
        description: 'Own lines to draw, comma-separated (greetings/01, intro/new ...); empty = all of them'
        default: ''
  pull_request:
    paths:
      - 'talking_head/**'
      - '.github/workflows/face_pack.yml'

permissions:
  contents: read

concurrency:
  group: face-pack-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  STYLE: ${{ inputs.style || 'normal' }}
  STANDIN: ${{ inputs.standin }}
  LINES: ${{ github.event_name == 'pull_request' && 'greetings/01' || inputs.lines }}
  VOICE_REPO: ${{ vars.VOICE_REPO || 'RokctAI/lessons' }}
  VOICE_ROOT: ${{ vars.VOICE_ROOT || 'voices' }}
  HF_HOME: /home/runner/.cache/huggingface
  HF_HUB_DISABLE_TELEMETRY: '1'
  TH_ROOT: /home/runner/.talking_head

jobs:
  plan:
    # Same-repo PRs only: the jobs need the private repos' token.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      personas: ${{ steps.p.outputs.personas }}
    steps:
      - name: Check out agent team list (private; read-only)
        if: inputs.personas == 'all'
        uses: actions/checkout@v4
        with:
          repository: RokctAI/agent
          token: ${{ secrets.MONOREPO_PAT }}
          path: .agent
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /lms/team/tutors/CAPS/*/appearance/renders/card_1080x1440.webp
            /lms/team/assistants/CAPS/*/appearance/renders/card_1080x1440.webp
      - id: p
        env:
          PERSONAS: ${{ github.event_name == 'pull_request' && 'tutor_001' || inputs.personas }}
        run: |
          if [ "$PERSONAS" = all ]; then
            list=$(ls -d .agent/lms/team/{tutors,assistants}/CAPS/*/appearance/renders/card_1080x1440.webp | cut -d/ -f6)
          else
            list=$(echo "$PERSONAS" | tr ',' '\n' | xargs -n1)
          fi
          echo "personas=$(echo "$list" | grep -E '^(tutor|assistant)_[0-9]+$' | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          echo "$(echo "$list" | wc -l) members" | tee -a "$GITHUB_STEP_SUMMARY"

  pack:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        persona: ${{ fromJSON(needs.plan.outputs.personas) }}
    env:
      PERSONA: ${{ matrix.persona }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - name: Stand-in member
        run: echo "STANDIN_PERSONA=${STANDIN%%:*}" >> "$GITHUB_ENV"

      - name: Check out agent team (private; read-only)
        uses: actions/checkout@v4
        with:
          repository: RokctAI/agent
          token: ${{ secrets.MONOREPO_PAT }}
          path: .agent
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /lms/team/tutors/CAPS/${{ env.PERSONA }}/
            /lms/team/assistants/CAPS/${{ env.PERSONA }}/
            /lms/team/tutors/CAPS/${{ env.STANDIN_PERSONA || env.PERSONA }}/
            /lms/team/assistants/CAPS/${{ env.STANDIN_PERSONA || env.PERSONA }}/

      - name: Check out the voice repo (private; read-only)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.VOICE_REPO }}
          token: ${{ secrets.MONOREPO_PAT }}
          path: .voices
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /${{ env.VOICE_ROOT }}/team/tutors/CAPS/${{ env.PERSONA }}/
            /${{ env.VOICE_ROOT }}/team/assistants/CAPS/${{ env.PERSONA }}/
            /${{ env.VOICE_ROOT }}/team/tutors/CAPS/${{ env.STANDIN_PERSONA || env.PERSONA }}/
            /${{ env.VOICE_ROOT }}/team/assistants/CAPS/${{ env.STANDIN_PERSONA || env.PERSONA }}/

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: talking_head/requirements.txt

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m pip install --upgrade pip
          python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r talking_head/requirements.txt

      - name: Restore engines and weights
        uses: actions/cache@v4  # leak-guard: allow TH_ROOT holds only engine clones and public model weights (setup.sh)
        with:
          path: |
            ${{ env.TH_ROOT }}
            ${{ env.HF_HOME }}/hub
          key: talking-head-${{ hashFiles('talking_head/setup.sh') }}

      - name: Set up LivePortrait, MuseTalk and GFPGAN
        run: |
          bash talking_head/setup.sh "$TH_ROOT" | tee "$RUNNER_TEMP/setup.out"
          grep -E '^(LP_SRC|MUSE_SRC|GFPGAN_WEIGHTS)=' "$RUNNER_TEMP/setup.out" >> "$GITHUB_ENV"
          python -c "from torchaudio.pipelines import MMS_FA as b; b.get_model()" > /dev/null

      - name: Draw the pictures
        run: |
          set +x
          lines_dir="$RUNNER_TEMP/lines"; mkdir -p "$lines_dir"; txt="$RUNNER_TEMP/text.txt"
          portrait=$(python talking_head/line_text.py --portrait .agent "$PERSONA")
          if [ -n "$LINES" ]; then IFS=',' read -ra own <<< "$LINES"
          else mapfile -t own < <(python talking_head/line_text.py --list .agent "$PERSONA"); fi
          voiced=()
          for line in "${own[@]}"; do
            line=$(echo "$line" | xargs)
            python talking_head/line_text.py .agent ".voices/$VOICE_ROOT" "$PERSONA" "$line" "$txt" > /dev/null 2>&1 && voiced+=("$line")
          done
          if [ ${#voiced[@]} -gt 0 ]; then
            draw=("${voiced[@]}"); who="$PERSONA"; flag=
            echo "$PERSONA: ${#voiced[@]} of ${#own[@]} lines drawn from their own voice" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ -n "$STANDIN" ]; then
            IFS=',' read -ra draw <<< "${STANDIN#*:}"; who="$STANDIN_PERSONA"; flag=--no-lines
            echo "$PERSONA: no voice yet, pictures only from ${#draw[@]} stand-in lines ($who)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "$PERSONA: no voice yet and no stand-in set" >&2; exit 1
          fi
          for line in "${draw[@]}"; do
            line=$(echo "$line" | xargs)
            files=$(python talking_head/line_text.py .agent ".voices/$VOICE_ROOT" "$who" "$line" "$txt")
            start=$(date +%s)
            bash talking_head/make_face_pack.sh "$portrait" "${files##*$'\t'}" "$txt" "$lines_dir/$line" "$STYLE"
            echo "$line: $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          python talking_head/pack_persona.py "$lines_dir" "$RUNNER_TEMP/face/$PERSONA" $flag | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f "$txt"

      - name: Commit the pack next to the voices (shared branch in the voice repo)
        # Packs are pushed straight to the private voice repo: an artifact on this
        # public repo would publish members' faces.
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_PAT }}
        run: |
          set +x
          kind=$([[ "$PERSONA" == tutor_* ]] && echo tutors || echo assistants)
          dest="$VOICE_ROOT/team/$kind/CAPS/$PERSONA/face/$STYLE"
          branch="rokct/faces-$STYLE-$GITHUB_RUN_ID"
          cd .voices
          git config user.name "rokct-factory"; git config user.email "factory@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${VOICE_REPO}.git"
          git sparse-checkout add "/$dest/"
          if git fetch -q --depth 1 origin "$branch" 2>/dev/null; then git checkout -q -B "$branch" FETCH_HEAD; else git checkout -q -b "$branch"; fi
          rm -rf "$dest"; mkdir -p "$dest"; cp -r "$RUNNER_TEMP/face/$PERSONA/." "$dest/"
          git add -A "$dest"
          git commit -q -m "Face pack: $PERSONA $STYLE ($(ls "$dest"/m*.webp | wc -l) mouth pictures) [skip ci]"
          for try in 1 2 3 4 5 6; do
            git push -q origin "HEAD:$branch" && break
            sleep $(( try * 7 )); git fetch -q --depth 20 origin "$branch" && git rebase -q FETCH_HEAD
          done
          echo "$PERSONA: $(du -sk "$dest" | cut -f1) KB on $branch" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Pack size (PR test; nothing is kept)
        if: github.event_name == 'pull_request'
        run: |
          echo "$PERSONA: $(ls "$RUNNER_TEMP/face/$PERSONA"/m*.webp | wc -l) mouth pictures, $(du -sk "$RUNNER_TEMP/face/$PERSONA" | cut -f1) KB" | tee -a "$GITHUB_STEP_SUMMARY"

  pr:
    # One pull request in the voice repo for every pack this run pushed.
    needs: pack
    if: always() && github.event_name != 'pull_request' && needs.pack.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_PAT }}
        run: |
          set +x
          branch="rokct/faces-$STYLE-$GITHUB_RUN_ID"
          n=$(gh api "repos/$VOICE_REPO/compare/main...$branch" --jq .ahead_by 2>/dev/null || echo 0)
          [ "$n" -gt 0 ] || { echo "no packs were pushed"; exit 1; }
          gh api -X POST "repos/$VOICE_REPO/pulls" -f head="$branch" -f base=main \
            -f title="Face packs ($STYLE): $n members" \
            -f body="Talking-face pictures made by factory face_pack.yml (run ${GITHUB_RUN_ID}): per member shared mouth pictures, base and eye pictures, and a timing file per line that has a voice. Voice files are unchanged." --jq .html_url \
            | tee -a "$GITHUB_STEP_SUMMARY"
