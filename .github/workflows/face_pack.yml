name: Face pack

# Team members' talking-face pictures for the app (no video): per member one
# shared set of mouth pictures, a base picture and eye pictures, plus a small
# timing file per greeting / sign-off (tutors) or intro / sign-off / handover
# line (hosts). The app shows these full screen while the line's audio plays.
# Code: talking_head/ (still-head LivePortrait, MuseTalk lips, GFPGAN mouth
# sharpening, face_pack.py, pack_persona.py, plan_faces.py). CPU only.
#
# Each line is drawn from the member's own voice, so the mouth follows exactly
# what they say. A member with no voice yet gets pictures only: their portrait
# speaks a few lines in a stand-in voice and no timing files are kept (Ray,
# 2026-11-23: the app plays a lesson only once all its audio exists). Run them
# again once their voice exists. Timing real lines against stand-in pictures
# was tried and looked wrong (Ray, 2026-11-20).
# One pack per style: 'clear' (Grade R-3, wider mouth) and 'normal' are separate
# (Ray, 2026-11-20).
#
# A line takes about an hour on a GitHub runner, so each line is its own job.
# Line packs are pushed to the run's branch in the voice repo under
# face/<style>.lines/, then one job per member merges them into the shared pack
# (face/<style>/) and removes the line folders. The run opens one pull request.
# No artifacts: on this public repo they would publish members' faces.
# Portraits and line text come from agent (read-only); voice audio is only read.
# Logs carry names, counts and sizes only, never line text: this repo is public.
# A PR touching talking_head/ draws tutor_001's first greeting and reports its
# size only (nothing is kept).

on:
  workflow_dispatch:
    inputs:
      personas:
        description: 'Team members, comma-separated (tutor_001,assistant_005), or "all" = every member with a portrait'
        default: 'tutor_001'
      style:
        description: 'Mouth style: normal (Grade 4-12, hosts) or clear (Grade R-3: wider, rounder, held longer)'
        type: choice
        options: [normal, clear]
        default: normal
      standin:
        description: 'For members with no voice yet: stand-in lines that draw their pictures, as <persona>:<line>,<line>'
        default: 'tutor_001:greetings/01,greetings/02,greetings/03,signoffs/01'
      lines:
        description: 'Own lines to draw, comma-separated (greetings/01, intro/new ...); empty = all of them'
        default: ''
  pull_request:
    paths:
      - 'talking_head/**'
      - '.github/workflows/face_pack.yml'

permissions:
  contents: read

concurrency:
  group: face-pack-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  STYLE: ${{ inputs.style || 'normal' }}
  STANDIN: ${{ inputs.standin }}
  LINES: ${{ github.event_name == 'pull_request' && 'greetings/01' || inputs.lines }}
  VOICE_REPO: ${{ vars.VOICE_REPO || 'RokctAI/lessons' }}
  VOICE_ROOT: ${{ vars.VOICE_ROOT || 'voices' }}
  HF_HOME: /home/runner/.cache/huggingface
  HF_HUB_DISABLE_TELEMETRY: '1'
  TH_ROOT: /home/runner/.talking_head

jobs:
  plan:
    # Same-repo PRs only: the jobs need the private repos' token.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      draw: ${{ steps.p.outputs.draw }}
      personas: ${{ steps.p.outputs.personas }}
    steps:
      - uses: actions/checkout@v4

      - id: p
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_PAT }}
          PERSONAS: ${{ github.event_name == 'pull_request' && 'tutor_001' || inputs.personas }}
        run: |
          set +x
          # File lists only (no file contents): who has a portrait and which lines have audio.
          list() {
            git clone -q --filter=blob:none --no-checkout --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/$1.git" "$RUNNER_TEMP/$2"
            git -C "$RUNNER_TEMP/$2" ls-tree -r --name-only HEAD "$3"
          }
          list RokctAI/agent agent lms/team > "$RUNNER_TEMP/agent_files.txt"
          list "$VOICE_REPO" voices "$VOICE_ROOT/team" | sed "s|^$VOICE_ROOT/|voices/|" > "$RUNNER_TEMP/voice_files.txt"
          (cd talking_head && python3 plan_faces.py "$RUNNER_TEMP/agent_files.txt" "$RUNNER_TEMP/voice_files.txt" \
             "$PERSONAS" "$STANDIN" "$LINES") > "$RUNNER_TEMP/plan.json" 2> "$RUNNER_TEMP/plan.log"
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/plan.log"
          echo "draw=$(jq -c .draw "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"
          echo "personas=$(jq -c .personas "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"
          echo "$(jq '.draw | length' "$RUNNER_TEMP/plan.json") lines to draw" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$(jq '.draw | length' "$RUNNER_TEMP/plan.json")" -gt 0 ]

  draw:
    # One line per job.
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.draw) }}
    env:
      PERSONA: ${{ matrix.persona }}
      LINE: ${{ matrix.line }}
      WHO: ${{ matrix.who }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - name: Check out agent team (private; read-only)
        uses: actions/checkout@v4
        with:
          repository: RokctAI/agent
          token: ${{ secrets.MONOREPO_PAT }}
          path: .agent
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /lms/team/tutors/CAPS/${{ matrix.persona }}/
            /lms/team/assistants/CAPS/${{ matrix.persona }}/
            /lms/team/tutors/CAPS/${{ matrix.who }}/
            /lms/team/assistants/CAPS/${{ matrix.who }}/

      - name: Check out the voice repo (private)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.VOICE_REPO }}
          token: ${{ secrets.MONOREPO_PAT }}
          path: .voices
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /${{ env.VOICE_ROOT }}/team/tutors/CAPS/${{ matrix.who }}/
            /${{ env.VOICE_ROOT }}/team/assistants/CAPS/${{ matrix.who }}/

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: talking_head/requirements.txt

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m pip install --upgrade pip
          python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r talking_head/requirements.txt

      - name: Restore engines and weights
        uses: actions/cache@v4  # leak-guard: allow TH_ROOT holds only engine clones and public model weights (setup.sh)
        with:
          path: |
            ${{ env.TH_ROOT }}
            ${{ env.HF_HOME }}/hub
          key: talking-head-${{ hashFiles('talking_head/setup.sh') }}

      - name: Set up LivePortrait, MuseTalk and GFPGAN
        run: |
          bash talking_head/setup.sh "$TH_ROOT" | tee "$RUNNER_TEMP/setup.out"
          grep -E '^(LP_SRC|MUSE_SRC|GFPGAN_WEIGHTS)=' "$RUNNER_TEMP/setup.out" >> "$GITHUB_ENV"
          python -c "from torchaudio.pipelines import MMS_FA as b; b.get_model()" > /dev/null

      - name: Draw the line
        run: |
          set +x
          txt="$RUNNER_TEMP/text.txt"; out="$RUNNER_TEMP/line"
          portrait=$(python talking_head/line_text.py --portrait .agent "$PERSONA")
          files=$(python talking_head/line_text.py .agent ".voices/$VOICE_ROOT" "$WHO" "$LINE" "$txt")
          start=$(date +%s)
          bash talking_head/make_face_pack.sh "$portrait" "${files##*$'\t'}" "$txt" "$out" "$STYLE"
          rm -f "$txt"
          src=$([ "$WHO" = "$PERSONA" ] && echo "own voice" || echo "stand-in")
          echo "$PERSONA $LINE ($src): $(ls "$out"/m*.webp | wc -l) mouth pictures, $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Push the line pack to the run's branch in the voice repo
        # Straight to the private voice repo: an artifact on this public repo
        # would publish members' faces.
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_PAT }}
        run: |
          set +x
          kind=$([[ "$PERSONA" == tutor_* ]] && echo tutors || echo assistants)
          dest="$VOICE_ROOT/team/$kind/CAPS/$PERSONA/face/$STYLE.lines/$LINE"
          branch="rokct/faces-$STYLE-$GITHUB_RUN_ID"
          cd .voices
          git config user.name "rokct-factory"; git config user.email "factory@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${VOICE_REPO}.git"
          git sparse-checkout set --no-cone "/$dest/"
          if git fetch -q --depth 1 origin "$branch" 2>/dev/null; then git checkout -q -B "$branch" FETCH_HEAD; else git checkout -q -b "$branch"; fi
          mkdir -p "$dest"; cp -r "$RUNNER_TEMP/line/." "$dest/"
          git add -A "$dest"
          git commit -q -m "Face line: $PERSONA $LINE $STYLE [skip ci]"
          for try in 1 2 3 4 5 6 7 8; do
            git push -q origin "HEAD:$branch" && exit 0
            sleep $(( try * 5 + RANDOM % 10 ))
            git fetch -q --depth 20 origin "$branch" && git rebase -q FETCH_HEAD
          done
          exit 1

  pack:
    # One job per member: merge their line packs into the shared pack.
    needs: [plan, draw]
    if: always() && github.event_name != 'pull_request' && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1   # all push to the same branch
      matrix:
        member: ${{ fromJSON(needs.plan.outputs.personas) }}
    env:
      PERSONA: ${{ matrix.member.persona }}
      OWN: ${{ matrix.member.own }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Merge the member's lines on the run's branch
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_PAT }}
        run: |
          set +x
          python -m pip install -q numpy opencv-python-headless
          kind=$([[ "$PERSONA" == tutor_* ]] && echo tutors || echo assistants)
          face="$VOICE_ROOT/team/$kind/CAPS/$PERSONA/face"
          branch="rokct/faces-$STYLE-$GITHUB_RUN_ID"
          git clone -q --depth 1 --filter=blob:none --sparse -b "$branch" \
            "https://x-access-token:${GH_TOKEN}@github.com/${VOICE_REPO}.git" "$RUNNER_TEMP/v" \
            || { echo "$PERSONA: no lines were pushed" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          cd "$RUNNER_TEMP/v"
          git sparse-checkout set --no-cone "/$face/"
          lines="$face/$STYLE.lines"; pack="$face/$STYLE"
          [ -d "$lines" ] || { echo "$PERSONA: no lines were drawn" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          n=$(find "$lines" -name timing.json | wc -l)
          flag=$([ "$OWN" = true ] && echo "" || echo --no-lines)
          [ ! -e "$pack" ] || git rm -rq -- "$pack"
          python "$GITHUB_WORKSPACE/talking_head/pack_persona.py" "$lines" "$pack" $flag | tail -1 | sed "s/^/$PERSONA: /" | tee -a "$GITHUB_STEP_SUMMARY"
          git rm -rq -- "$lines"
          git config user.name "rokct-factory"; git config user.email "factory@users.noreply.github.com"
          git add -A "$pack"
          git commit -q -m "Face pack: $PERSONA $STYLE from $n lines ($(ls "$pack"/m*.webp | wc -l) mouth pictures) [skip ci]"
          git push -q origin "HEAD:$branch"

  pr:
    # One pull request in the voice repo for every pack this run made.
    needs: pack
    if: always() && github.event_name != 'pull_request' && needs.pack.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_PAT }}
        run: |
          set +x
          branch="rokct/faces-$STYLE-$GITHUB_RUN_ID"
          git clone -q --depth 1 --filter=blob:none --no-checkout -b "$branch" \
            "https://x-access-token:${GH_TOKEN}@github.com/${VOICE_REPO}.git" "$RUNNER_TEMP/v" \
            || { echo "nothing was pushed"; exit 1; }
          files=$(git -C "$RUNNER_TEMP/v" ls-tree -r --name-only HEAD "$VOICE_ROOT/team")
          n=$(grep -c "/face/$STYLE/face.json$" <<< "$files" || true)
          left=$(grep -c "/face/$STYLE.lines/" <<< "$files" || true)
          [ "$n" -gt 0 ] || { echo "no packs were made"; exit 1; }
          note=""
          [ "$left" -eq 0 ] || note=" Some line folders ($STYLE.lines) are still on the branch because a member's merge failed; they must be removed before merging."
          gh api -X POST "repos/$VOICE_REPO/pulls" -f head="$branch" -f base=main \
            -f title="Face packs ($STYLE): $n members" \
            -f body="Talking-face pictures made by factory face_pack.yml (run ${GITHUB_RUN_ID}): per member shared mouth pictures, base and eye pictures, and a timing file per line drawn from the member's own voice. Members with no voice yet have pictures only.${note} Voice files are unchanged." \
            --jq .html_url | tee -a "$GITHUB_STEP_SUMMARY"
