name: Tutor Images - Derive App Renditions
# A tutor or assistant portrait is generated once and used everywhere: the
# full-bleed discovery card, the profile/detail avatar, and the 56pt session
# speaker bubble. Committing the source portrait is enough - this derives
# every rendition and commits them back, so nobody has to remember to run
# the script or to match the app's sizes by hand.
#
# The renders/ output is EXCLUDED from the trigger paths. Without that, the
# bot's own commit would re-trigger this workflow forever; '[skip ci]' alone
# is not enough, because it is a convention some runners ignore.
on:
  push:
    paths:
      - 'lessons/tutors/*/appearance/**'
      - 'lessons/assistants/*/appearance/**'
      # Whatever the image model hands you - Gemini returns .jpg or
      # .png depending on the export. All four are accepted by
      # tutor_images.py's RASTER list.
      - 'lessons/onboarding/*/*.png'
      - 'lessons/onboarding/*/*.jpg'
      - 'lessons/onboarding/*/*.jpeg'
      - 'lessons/onboarding/*/*.webp'
      - '!lessons/tutors/*/appearance/renders/**'
      - '!lessons/assistants/*/appearance/renders/**'
      - '!lessons/onboarding/*/renders/**'
      - 'lessons/scripts/tutor_images.py'
    branches:
      - main
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: python -m pip install --quiet Pillow

      - name: Derive renditions
        run: python lessons/scripts/tutor_images.py

      - name: Commit renditions
        run: |
          if [ -n "$(git status --porcelain lessons/tutors lessons/assistants lessons/onboarding)" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            # -A over the two trees, not a renders/* glob: before any
            # assistant has a portrait that glob matches nothing and git
            # exits 128. The script only ever writes under appearance/
            # renders/, so this stages exactly the same files.
            git add -A lessons/tutors lessons/assistants lessons/onboarding
            git commit -m "🤖 [CI] Tutor images: derived app renditions from source portraits [skip ci]"
            git push
          else
            echo "No rendition changes - nothing to commit."
          fi
