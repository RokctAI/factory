# Engine copy of factory's lesson_regeneration.yml: runs against RokctAI/lessons (checked out at the
# workspace root with MONOREPO_PAT). Generated by split/split.py; see split/README.md.
name: Lesson Regeneration

# Re-enters denied lessons into generation. Runs whenever a review-state file
# changes on main (the Supacharge admin review endpoint writes them via the
# Contents API): school/scripts/CAPS/regen_denied.py re-queues the job card
# (pipeline lessons) or writes a regen brief under school/reviews/regen/
# (session lessons), bounded by school/reviews/regen_state.json.
#
# Loop guards (both, for safety):
#   1. The trigger excludes school/reviews/regen_state.json, so the bot
#      commit this workflow makes does not re-trigger it.
#   2. The script only rewrites state when a new denial/approval actually
#      changed it, and the commit step is a no-op on no diff.

on:
  workflow_dispatch:
    inputs:
      router_before:
        description: 'Set by content_router: start of the pushed range. Leave empty when running by hand.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: lesson-regeneration
  cancel-in-progress: false

jobs:
  queue_regeneration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RokctAI/lessons
          token: ${{ secrets.MONOREPO_PAT }}

      - name: Queue regeneration for denied reviews
        run: python3 school/scripts/CAPS/regen_denied.py

      - name: Commit queue changes if any
        run: |
          git add school/reviews/regen_state.json school/reviews/regen .rokct/agent/jobs
          if git diff --cached --quiet; then
            echo "no regeneration changes; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[CI] Queue lesson regeneration for denied reviews"
          git push
