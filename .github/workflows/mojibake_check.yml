# Engine copy of factory's mojibake_check.yml: runs against RokctAI/lessons (checked out at the
# workspace root with MONOREPO_PAT). Generated by split/split.py; see split/README.md.
name: Mojibake Check

# Enforcement layer for encoding corruption (UTF-8 decoded as cp1252 —
# 'â€' / 'Â' / 'Ã' artifacts). A corrupted card must never advance a pipeline
# level and a corrupted lesson file must never reach a release. The same
# checker runs locally (school/scripts/CAPS/check_mojibake.py, fail fast before a
# push), but local checks can be skipped — CI can't.
#
# Fast by design: checks only the files the push actually changed.
# workflow_dispatch runs the full-tree scan instead.

on:
  workflow_dispatch:
    inputs:
      router_before:
        description: 'Set by content_router: start of the pushed range. Leave empty when running by hand.'
        required: false
        default: ''

jobs:
  mojibake_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RokctAI/lessons
          token: ${{ secrets.MONOREPO_PAT }}
          fetch-depth: 0
          filter: blob:none

      - name: Check changed files for mojibake
        run: |
          if [ "${{ (inputs.router_before && 'push' || github.event_name) }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch: full-tree scan."
            python3 school/scripts/CAPS/check_mojibake.py --all
            exit $?
          fi
          FILES=$(git diff --name-only ${{ inputs.router_before || 'HEAD~1' }} HEAD -- '.rokct/agent/jobs/**/*.md' 'school/**' | grep -v '^school/scripts/CAPS/check_mojibake.py$' || true)
          # Drop deleted paths; keep only files that exist in this checkout.
          EXISTING=""
          for F in $FILES; do
            [ -f "$F" ] && EXISTING="$EXISTING $F"
          done
          if [ -z "$EXISTING" ]; then
            echo "No changed card/lesson files to check."
            exit 0
          fi
          python3 school/scripts/CAPS/check_mojibake.py $EXISTING
