# Engine copy of factory's school_terms_to_agent.yml: runs against RokctAI/lessons (checked out at the
# workspace root with MONOREPO_PAT). Generated by split/split.py; see split/README.md.
name: School Terms - Sync Into Agent
# The RokctAI/agent backend keeps its own packaged copy of the DBE term
# dates (lms/frappe/src/tenant/rlms/data/sa_school_terms.json). This copies
# each year verified here (school/curriculum/CAPS/school_calendar/<year>.json)
# into that copy, so nobody has to remember to. It runs here because agent is
# private and its Actions minutes are scarce (same reason as agent_checks.yml).
#
# The copying rules live in agent's own sync_school_terms.py, run against
# this repo's school_calendar/ folder: only VERIFIED years (never
# PENDING-HUMAN ones from school_calendar_refresh.yml), and never a rewrite of
# a year agent already has. If verified dates here differ from agent's, the
# script fails and this run goes red so a person checks both against the
# gazette.
#
# Like voice_batch.yml, this never touches agent main: a new year is pushed to
# the rokct/school-terms branch and a PR is opened (or the open one updated),
# with MONOREPO_PAT passed as a per-command header, never stored.
on:
  schedule:
    - cron: '17 5 10 * *'  # 10th of every month, 05:17 UTC: the fallback
  workflow_dispatch:
    inputs:
      router_before:
        description: 'Set by content_router: start of the pushed range. Leave empty when running by hand.'
        required: false
        default: ''

concurrency:
  group: school-terms-to-agent
  cancel-in-progress: false

env:
  AGENT_BRANCH: rokct/school-terms
  TERMS: lms/frappe/src/tenant/rlms/data/sa_school_terms.json

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RokctAI/lessons
          token: ${{ secrets.MONOREPO_PAT }}

      - name: Check out agent main (private)
        uses: actions/checkout@v4
        with:
          repository: RokctAI/agent
          token: ${{ secrets.MONOREPO_PAT }}
          ref: main
          path: .agent
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: lms/frappe/src/tenant/rlms

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Copy verified years into agent's term dates
        run: |
          script=.agent/lms/frappe/src/tenant/rlms/data/sync_school_terms.py
          if [ ! -f "$script" ]; then
            echo "::notice::agent main has no sync_school_terms.py yet; nothing to do"
            exit 0
          fi
          python "$script" --factory-dir school/curriculum/CAPS/school_calendar

      - name: Check agent's term tests still pass
        working-directory: .agent/lms/frappe/src/tenant/rlms
        run: python -m unittest tests.test_term_report_rules

      - name: Push the new years and open the agent PR
        env:
          AGENT_PAT: ${{ secrets.MONOREPO_PAT }}
          GH_TOKEN: ${{ secrets.MONOREPO_PAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +x
          cd .agent
          if git diff --quiet -- "$TERMS"; then
            echo "agent already has every verified year"
            exit 0
          fi
          b64="$(printf 'x-access-token:%s' "$AGENT_PAT" | base64 -w0)"
          echo "::add-mask::$b64"
          # Every git command carries the header: the sparse checkout may
          # lazily fetch a blob from the private remote.
          agit() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $b64" "$@"; }
          agit config user.name "github-actions[bot]"
          agit config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          agit checkout --quiet -B "$AGENT_BRANCH"
          agit add -- "$TERMS"
          agit commit --quiet -m "School terms: copy newly verified years from factory" \
            -m "Copied by factory's school_terms_to_agent.yml ($RUN_URL) from school/curriculum/CAPS/school_calendar/."
          # A bot-only branch rebuilt from agent main on every run.
          agit push --quiet --force origin "HEAD:refs/heads/$AGENT_BRANCH"
          if [ -z "$(gh pr list --repo RokctAI/agent --head "$AGENT_BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --repo RokctAI/agent --head "$AGENT_BRANCH" --base main \
              --title "School terms: copy newly verified years from factory" \
              --body "Factory verified a new school-calendar year against its gazette; this copies its term dates into \`sa_school_terms.json\` with sync_school_terms.py. Run: $RUN_URL"
          else
            echo "updated the open agent PR on $AGENT_BRANCH"
          fi
