name: Unit tests

# Stdlib unittest suite for the pipeline helper modules
# (lessons/scripts/tests/). No third-party deps.
on:
  push:
    paths:
      - 'lessons/scripts/**'
  pull_request:
    paths:
      - 'lessons/scripts/**'
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run unittest suite
        run: python3 -m unittest discover -s lessons/scripts/tests -v
