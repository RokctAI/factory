name: Unit tests

# Stdlib unittest suites for the pipeline helper modules
# (lessons/scripts/CAPS/tests/) and the workflow helper scripts
# (.github/scripts/tests/). No third-party deps.
on:
  push:
    paths:
      - 'lessons/scripts/**'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'lessons/scripts/**'
      - '.github/scripts/**'
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run unittest suite (lessons/scripts)
        run: python3 -m unittest discover -s lessons/scripts/CAPS/tests -v

      - name: Run unittest suite (.github/scripts)
        run: python3 -m unittest discover -s .github/scripts/tests -v
