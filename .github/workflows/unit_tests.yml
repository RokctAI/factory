name: Unit tests

# Stdlib unittest suites for the pipeline helper modules
# (.github/scripts/tests/). The lesson script suites run in
# lesson_unit_tests.yml against RokctAI/lessons. No third-party deps.
on:
  push:
    paths:
      - '.github/scripts/**'
      # test_seed_app_repo.py asserts invariants on the committed template
      # tree (layered layout, no .relation), so template edits must run it.
      - 'templates/app/**'
  pull_request:
    paths:
      - '.github/scripts/**'
      - 'templates/app/**'
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run unittest suite (.github/scripts)
        run: python3 -m unittest discover -s .github/scripts/tests -v
