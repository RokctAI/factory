name: School Calendar - Annual Refresh
# The DBE gazettes a new national school calendar every year. This checks
# monthly during the publication window (Aug-Feb) whether next year's
# calendar is out, auto-extracts it when the page parses cleanly (committed
# as verified: PENDING-HUMAN for confirmation against the gazette), and
# fails the run loudly when the calendar is published but needs a human to
# extract it. The app backend consumes these files from the repo
# (lessons/curriculum/CAPS/school_calendar/{year}.json) to map ATP terms to
# real dates.
on:
  schedule:
    - cron: '30 4 3 1,2,8,9,10,11,12 *'  # 3rd of Aug-Feb months, 04:30 UTC
  workflow_dispatch:

jobs:
  check_calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check / extract next year's calendar
        id: check
        run: |
          set +e
          python lessons/scripts/CAPS/school_calendar_check.py --write
          code=$?
          set -e
          if [ "$code" = "1" ]; then
            echo "::error::Next year's school calendar is published but could not be auto-extracted - add lessons/curriculum/CAPS/school_calendar/<year>.json by hand from the gazette."
            exit 1
          elif [ "$code" = "2" ]; then
            echo "::warning::Could not reach the school-calendar source page; will retry next scheduled run."
          fi

      - name: Commit new calendar file if written
        run: |
          if [ -n "$(git status --porcelain lessons/curriculum/CAPS/school_calendar/)" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add lessons/curriculum/CAPS/school_calendar/
            git commit -m "🤖 [CI] School calendar: auto-extracted next year's term dates (verified: PENDING-HUMAN) [skip ci]"
            git push
          else
            echo "No calendar changes."
          fi
