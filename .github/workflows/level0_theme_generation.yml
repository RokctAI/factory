name: Level 0 - Theme Generation
on:
  schedule:
    - cron: '0 * * * *' # Hourly check
  workflow_dispatch:

jobs:
  check_and_trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initiate Protocol
        run: |
          if [ -f ".rokct/initiate.py" ]; then
            echo "🚀 Running local initiate.py..."
            python .rokct/initiate.py
          else
            echo "🌐 Fetching web initiate.py from remote protocol..."
            curl -sSL https://raw.githubusercontent.com/RokctAI/The-Rokct-Protocol/main/profiles/web/initiate.py -o initiate_temp.py
            python initiate_temp.py
            rm initiate_temp.py
          fi

      - name: Check Queue and Trigger
        run: |
          TYPES=("book.poetry" "book.fiction" "book.short_story" "book.children" "film.documentary")

          for TYPE in "${TYPES[@]}"; do
            # Count only ACTIVE cards for this type — exclude stalled so they
            # don't inflate the queue and prevent new theme generation.
            PENDING_COUNT=0
            for f in .rokct/agent/jobs/pending/*_${TYPE}_*.md; do
              [ -f "$f" ] || continue
              [[ "$f" == *template* ]] && continue
              grep -qE '^status:[[:space:]]*stalled' "$f" && continue
              PENDING_COUNT=$((PENDING_COUNT + 1))
            done
            echo "Current active (non-stalled) pending themes for $TYPE: $PENDING_COUNT"

            if [ "$PENDING_COUNT" -lt 5 ]; then
              echo "🚀 Triggering Level 0 Theme Discovery for $TYPE..."

              # Update prompt card to focus on this type
              PROMPT="Generate 5 new unique themes for $TYPE. Return only the list in the format: theme | type"
              jq --arg p "$PROMPT" '.prompt = $p | .immediate = "true"' .rokct/agent/prompts/in_progress/level0_theme_discovery.json > tmp.json && mv tmp.json .rokct/agent/prompts/in_progress/level0_theme_discovery.json

              git config --global user.name "github-actions[bot]"
              git config --global user.email "github-actions[bot]@users.noreply.github.com"
              git add .rokct/agent/prompts/in_progress/level0_theme_discovery.json
              # Deliberately NOT [skip ci]: agent.yml's push trigger watches this exact
              # path (.rokct/agent/prompts/in_progress/*.json) to process the new prompt.
              # [skip ci] here would suppress that trigger entirely, leaving the prompt
              # written but never actually processed -- which is what was happening.
              git commit -m "🤖 [CI] Trigger Theme Discovery for $TYPE" || true
              eval "git push origin main"

              # Break after triggering one to avoid overwhelming
              break
            fi
          done

      - name: Surface Stuck Cards Needing Concept Approval
        run: |
          # Detect non-lesson cards that are stuck in concept_generated with no
          # concept_status set — these need a human to set concept_status: approved
          # before Level 3 can advance them, and previously had no visibility.
          STUCK=0
          for FILE in .rokct/agent/jobs/pending/*.md; do
            [ -f "$FILE" ] || continue
            [[ "$FILE" == *template* ]] && continue
            TYPE=$(grep '^type:' "$FILE" | cut -d':' -f2 | xargs)
            case "$TYPE" in lesson.*) continue ;; esac
            STATUS=$(grep '^status:' "$FILE" | cut -d':' -f2 | cut -d'#' -f1 | xargs)
            CONCEPT_STATUS=$(grep '^concept_status:' "$FILE" | cut -d':' -f2 | xargs)
            if [ "$STATUS" = "concept_generated" ] && [ -z "$CONCEPT_STATUS" ]; then
              ID=$(grep '^id:' "$FILE" | cut -d':' -f2 | xargs)
              echo "⚠️  ACTION REQUIRED: $ID ($TYPE) is at status=concept_generated but concept_status is blank."
              echo "   → Set 'concept_status: approved' in $FILE to advance to Level 3 (Rule Generation)."
              STUCK=$((STUCK + 1))
            fi
          done
          if [ "$STUCK" -eq 0 ]; then
            echo "✅ No cards stuck waiting for concept approval."
          else
            echo "Total stuck: $STUCK card(s) need human concept_status approval."
          fi
