name: Level 0 - Theme Generation
on:
  schedule:
    - cron: '0 * * * *' # Hourly check
  workflow_dispatch:

jobs:
  check_and_trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initiate Protocol
        run: |
          if [ -f ".rokct/initiate.py" ]; then
            echo "🚀 Running local initiate.py..."
            python .rokct/initiate.py
          else
            echo "🌐 Fetching web initiate.py from remote protocol..."
            curl -sSL https://raw.githubusercontent.com/RokctAI/The-Rokct-Protocol/main/profiles/web/initiate.py -o initiate_temp.py
            python initiate_temp.py
            rm initiate_temp.py
          fi

      - name: Check Queue and Trigger
        run: |
          TYPES=("book.poetry" "book.fiction" "book.short_story" "book.children" "film.documentary")

          for TYPE in "${TYPES[@]}"; do
            PENDING_COUNT=$(ls .rokct/agent/jobs/pending/*_${TYPE}_*.md 2>/dev/null | grep -v "template.md" | wc -l)
            echo "Current pending themes for $TYPE: $PENDING_COUNT"

            if [ "$PENDING_COUNT" -lt 5 ]; then
              echo "🚀 Triggering Level 0 Theme Discovery for $TYPE..."

              # Update prompt card to focus on this type
              PROMPT="Generate 5 new unique themes for $TYPE. Return only the list in the format: theme | type"
              jq --arg p "$PROMPT" '.prompt = $p | .immediate = "true"' .rokct/agent/prompts/in_progress/level0_theme_discovery.json > tmp.json && mv tmp.json .rokct/agent/prompts/in_progress/level0_theme_discovery.json

              git config --global user.name "github-actions[bot]"
              git config --global user.email "github-actions[bot]@users.noreply.github.com"
              git add .rokct/agent/prompts/in_progress/level0_theme_discovery.json
              git commit -m "🤖 [CI] Trigger Theme Discovery for $TYPE [skip ci]" || true
              eval "git push origin main"

              # Break after triggering one to avoid overwhelming
              break
            fi
          done
