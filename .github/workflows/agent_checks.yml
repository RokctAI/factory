name: Agent Checks (Offloaded)

# Heavy check suite for the RokctAI/agent repo, offloaded here so it runs on
# free public-repo Actions minutes. The agent repo fires a repository_dispatch
# (event_type: agent-code-changed) from its thin notify_factory workflow; this
# suite checks out the dispatched SHA of RokctAI/agent and reports a single
# combined commit status back onto that SHA.
#
# Invocations mirror shared-workflows universal-linter.yml (ruff) and
# universal-security.yml (bandit / pip-audit) so verdicts match the in-repo
# suites, which keep running in parallel until this path is proven.

on:
  repository_dispatch:
    types: [agent-code-changed]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # Weekly safety net (Mon 03:00 UTC) against main

# One run per dispatched agent SHA; a newer dispatch for the same SHA (or a
# re-run) cancels the older one. Non-dispatch runs fall back to run_id so they
# never collide with each other.
concurrency:
  group: agent-checks-${{ github.event.client_payload.sha || github.run_id }}
  cancel-in-progress: true

env:
  AGENT_REF: ${{ github.event.client_payload.sha || 'main' }}

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RokctAI/agent
        uses: actions/checkout@v4
        with:
          repository: RokctAI/agent
          token: ${{ secrets.MONOREPO_PAT }}
          ref: ${{ github.event.client_payload.sha || 'main' }}
          path: agent

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install check tools
        run: |
          pip install ruff bandit pip-audit

      # Mirrors universal-linter.yml "Run Ruff (Lint Gate)" — same select /
      # ignore / exclude flags and the same findings detection, but read-only:
      # findings fail this job instead of opening an issue.
      - name: Ruff Lint Gate
        working-directory: agent
        run: |
          ruff check . \
            --select=E9,F63,F7,F82,E,W,C90,F \
            --ignore=E501,W503,W504,F401,F841 \
            --exclude ".github,.git,node_modules,env,venv,.venv,__pycache__" \
            --output-format=text > ruff_output.txt 2>&1 || true

          cat ruff_output.txt

          if grep -q ":" ruff_output.txt; then
            echo "❌ Ruff findings detected."
            exit 1
          fi
          echo "✅ Ruff clean."

      # Mirrors universal-security.yml "Run Bandit (Code Analysis)" — same
      # exclude / severity flags; High-severity findings fail the job.
      - name: Bandit (Code Analysis)
        if: ${{ !cancelled() }}
        working-directory: agent
        run: |
          bandit -r . --exclude ./.git,./node_modules,./venv --severity high > bandit_output.txt 2>&1 || true
          cat bandit_output.txt
          if [ -s bandit_output.txt ] && grep -q "Severity: High" bandit_output.txt; then
            echo "❌ Bandit high-severity findings detected."
            exit 1
          fi
          echo "✅ Bandit clean (no high-severity findings)."

      # Mirrors universal-security.yml "Run Pip Audit" — audits requirements.txt
      # when present, same detection; vulnerable dependencies fail the job.
      - name: Pip Audit (Dependency Vulnerabilities)
        if: ${{ !cancelled() }}
        working-directory: agent
        run: |
          if [ -f "requirements.txt" ]; then
            pip-audit -r requirements.txt > pip_audit_output.txt 2>&1 || true
            cat pip_audit_output.txt
            if [ -s pip_audit_output.txt ] && grep -q "dependency" pip_audit_output.txt; then
              echo "❌ pip-audit found vulnerable dependencies."
              exit 1
            fi
            echo "✅ pip-audit clean."
          else
            echo "Skipping pip-audit (No requirements.txt found)"
          fi

  # The real signal the agent repo has never had: a genuine toolchain running
  # flutter analyze on every Dart package. Cached SDK + pub deps keep the
  # per-run cost low (the audit's biggest-cost note).
  flutter-analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - agent/dart
          - fav/dart
          - lms/dart
          - replay/dart
          - subscriptions/dart
    steps:
      - name: Checkout RokctAI/agent
        uses: actions/checkout@v4
        with:
          repository: RokctAI/agent
          token: ${{ secrets.MONOREPO_PAT }}
          ref: ${{ github.event.client_payload.sha || 'main' }}
          path: agent

      - name: Setup Flutter (cached)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub Get
        working-directory: agent/${{ matrix.package }}
        run: |
          flutter pub get

      - name: Flutter Analyze
        working-directory: agent/${{ matrix.package }}
        run: |
          # --no-fatal-infos matches universal-flutter-analyze's default gate:
          # errors and warnings block, infos never do.
          flutter analyze --no-fatal-infos

  # Posts ONE combined commit status back onto the dispatched agent SHA so the
  # verdict shows up on agent PRs/commits. Only meaningful for dispatched runs,
  # hence the client_payload.sha guard.
  status-report:
    needs: [python-checks, flutter-analyze]
    if: ${{ always() && github.event.client_payload.sha != '' && github.event.client_payload.sha != null }}
    runs-on: ubuntu-latest
    steps:
      - name: Post combined status to RokctAI/agent
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_PAT }}
          AGENT_SHA: ${{ github.event.client_payload.sha }}
          PY_RESULT: ${{ needs.python-checks.result }}
          FLUTTER_RESULT: ${{ needs.flutter-analyze.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${PY_RESULT}" = "success" ] && [ "${FLUTTER_RESULT}" = "success" ]; then
            state="success"
            description="python-checks + flutter-analyze passed"
          else
            state="failure"
            description="python: ${PY_RESULT}, flutter: ${FLUTTER_RESULT}"
          fi

          payload=$(jq -n \
            --arg state "${state}" \
            --arg description "${description}" \
            --arg target_url "${RUN_URL}" \
            '{state: $state, description: $description, target_url: $target_url, context: "factory/agent-checks"}')

          curl --fail-with-body -sS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/RokctAI/agent/statuses/${AGENT_SHA}" \
            -d "${payload}"

          echo "Posted ${state} (factory/agent-checks) to RokctAI/agent@${AGENT_SHA}"
