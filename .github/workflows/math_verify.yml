# Engine copy of factory's math_verify.yml: runs against RokctAI/lessons (checked out at the
# workspace root with MONOREPO_PAT). Generated by split/split.py; see split/README.md.
name: Maths Answer-Key Verification

# REPORT-ONLY sympy check of every maths and Maths Lit MCQ answer key
# (school/scripts/CAPS/math_verify.py). It recomputes what it can formalise
# (equations, inequalities, factorise/expand/simplify, evaluation,
# substitution, percent, ratio, finance, sequences) and reports
# verified / MISMATCH / MULTIPLE_CORRECT / NO_CORRECT / UNPARSEABLE / SKIPPED.
#
# It also step-checks what we TEACH: lesson scripts (script.md), knowledge-
# bite worked solutions (question.md), the on-screen maths of each lesson
# animation (manim_scene.py) and narration-vs-screen consistency, reporting
# STEP_OK / STEP_WRONG / ANSWER_WRONG / WARNING / UNPARSEABLE / SKIPPED. It
# checks truth, not method: any valid route passes.
#
# The private tutor snippets in RokctAI/agent are NOT read here; that check
# is a local CLI option (--agent) so private text never reaches public logs.
#
# Findings NEVER fail the build: the verifier always exits 0. The job goes red
# only if the verifier or its unit tests crash. The engine is public, so the
# report is never uploaded or written to the job summary: it is committed to
# the private lessons repo under school/reports/math_verify/.

on:
  push:
    paths:
      - '.github/workflows/math_verify.yml'
  pull_request:
    paths:
      - '.github/workflows/math_verify.yml'
  workflow_dispatch:
    inputs:
      router_before:
        description: 'Set by content_router: start of the pushed range. Leave empty when running by hand.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  math_verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RokctAI/lessons
          token: ${{ secrets.MONOREPO_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pinned sympy
        run: pip install -r school/scripts/CAPS/requirements-math-verify.txt

      - name: Unit tests (math_verify)
        run: python3 -m unittest discover -s school/scripts/CAPS/tests -p 'test_math_verify.py' -v

      - name: Verify every maths and Maths Lit MCQ (report only)
        run: |
          python3 school/scripts/CAPS/math_verify.py \
            --json math_verify_report.json --md math_verify_report.md

      - name: Step-check lesson scripts, worked solutions and animations (report only)
        run: |
          python3 school/scripts/CAPS/math_verify.py --steps-only \
            --steps-json math_steps_report.json --steps-md math_steps_report.md

      - name: Save the report in the lessons repo
        if: always()
        run: |
          mkdir -p school/reports/math_verify
          for f in math_verify_report.json math_verify_report.md math_steps_report.json math_steps_report.md; do
            if [ -f "$f" ]; then mv "$f" school/reports/math_verify/; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add school/reports/math_verify
          if git diff --staged --quiet; then echo "Report unchanged."; exit 0; fi
          git commit -m "🤖 [CI] Maths verification report [skip ci]"
          for i in 1 2 3; do
            git push origin HEAD:main && break
            git pull --rebase origin main || { git rebase --abort || true; exit 1; }
            sleep $((RANDOM % 3 + 1))
          done
