name: Lesson 0 - Topic Selection
on:
  schedule:
    - cron: '15 * * * *' # Hourly check, offset from book Level 0
  push:
    paths:
      - 'lessons/curriculum/*.json'
    branches:
      - main
  workflow_dispatch:

jobs:
  seed_topics:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initiate Protocol
        run: |
          if [ -f ".rokct/initiate.py" ]; then
            echo "🚀 Running local initiate.py..."
            python .rokct/initiate.py
          else
            echo "🌐 Fetching web initiate.py from remote protocol..."
            curl -sSL https://raw.githubusercontent.com/RokctAI/The-Rokct-Protocol/main/profiles/web/initiate.py -o initiate_temp.py
            python initiate_temp.py
            rm initiate_temp.py
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Regenerate Dashboard
        run: |
          python lessons/scripts/lesson_pipeline.py dashboard
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lessons/DASHBOARD.md
          if git diff --staged --quiet; then
            echo "Dashboard unchanged."
          else
            git commit -m "🤖 [CI] Refresh lesson dashboard [skip ci]"
            for i in 1 2 3; do
              git push origin main && break
              git pull --rebase origin main || { git rebase --abort || true; exit 1; }
              sleep $((RANDOM % 3 + 1))
            done
          fi

      - name: Check Queue and Seed Topics
        run: |
          TYPES=("lesson.maths" "lesson.physical_sciences" "lesson.economics" "lesson.geography" "lesson.maths_literacy" "lesson.accounting")

          for TYPE in "${TYPES[@]}"; do
            PENDING_COUNT=$(ls .rokct/agent/jobs/pending/*_${TYPE}_*.md 2>/dev/null | grep -v "template" | wc -l)
            echo "Current pending lessons for $TYPE: $PENDING_COUNT"

            if [ "$PENDING_COUNT" -lt 3 ]; then
              echo "🚀 Seeding next $TYPE topic from the CAPS curriculum list..."
              python lessons/scripts/lesson_pipeline.py seed --type "$TYPE" --limit 1

              git config --global user.name "github-actions[bot]"
              git config --global user.email "github-actions[bot]@users.noreply.github.com"
              git add .rokct/agent/jobs/pending/
              git commit -m "🤖 [CI] Lesson 0: Topic Selection for $TYPE [skip ci]" || true
              git push origin main

              # One seed per run, mirroring Level 0's one-trigger-per-run pattern
              break
            fi
          done
