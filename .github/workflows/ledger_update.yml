name: Ledger Update
on:
  workflow_call:
    inputs:
      id:
        required: true
        type: string
      type:
        required: true
        type: string
      theme:
        required: true
        type: string
      status:
        required: true
        type: string
      agent:
        required: true
        type: string
      session:
        required: true
        type: string
      pr:
        required: false
        type: string

jobs:
  update_ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The calling workflow usually pushed a card commit moments ago;
          # start from the branch tip, not the triggering SHA, or our push
          # is rejected as non-fast-forward.
          ref: main

      - name: Append to Ledger
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M")
          PR_VALUE="${{ inputs.pr }}"
          if [ -z "$PR_VALUE" ]; then PR_VALUE="—"; fi

          echo "| ${{ inputs.id }} | ${{ inputs.type }} | ${{ inputs.theme }} | ${{ inputs.status }} | ${{ inputs.agent }} | ${{ inputs.session }} | $PR_VALUE | $TIMESTAMP |" >> .rokct/agent/log/ledger.md

      - name: Commit Ledger Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .rokct/agent/log/ledger.md
          git commit -m "chore: update ledger for ${{ inputs.id }} [skip ci]" || exit 0
          for i in 1 2 3; do
            git push origin main && break
            git pull --rebase origin main || { git rebase --abort; exit 1; }
            sleep $((RANDOM % 4 + 1))
          done
