name: App Spawn

# Ray's acceptance gate for app ideas. Ideas are proposed conversationally and
# filed as issues with the `app-idea` label (see .github/ISSUE_TEMPLATE/
# app-idea.yml). Applying `approved` to one spawns its repo — nothing else
# does. Idea generation is deliberately not automated; only the build-out is.
#
# New repos land under vars.FACTORY_TARGET_OWNER, which defaults to the
# `RokctAI` org so the protocol bootstrap gives them the full treatment;
# promoting one out later is GitHub's native transfer. That default — and the
# canonical casing of it — lives in .github/scripts/owners.py, not here:
# initiate.py gates on the literal substring `RokctAI/` in the git origin URL,
# so every resolved owner is canonicalised before it becomes part of a remote.
# See docs/app-factory.md for the labels, the variable, and which token can
# create repos where.

on:
  issues:
    types: [labeled]

jobs:
  # Gated on `approved` alone. The `app-idea` requirement used to sit in this
  # `if` too, which meant labelling a non-idea issue `approved` skipped every
  # job in the run: no comment, no label removed, nothing to tell the person
  # their build never started. The requirement now lives in the job's first
  # step, so an ineligible issue fails here and goes out through the same
  # "Report failure on the issue" step a parse failure uses. Nothing downstream
  # runs either way, so this is a louder gate, not a looser one. Labelling an
  # issue anything other than `approved` — `app-idea` included — still skips
  # the whole workflow in silence.
  parse:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    outputs:
      name: ${{ steps.fields.outputs.name }}
      description: ${{ steps.fields.outputs.description }}
      visibility: ${{ steps.fields.outputs.visibility }}
      owner: ${{ steps.fields.outputs.owner }}
      spec: ${{ steps.fields.outputs.spec }}
    steps:
      # Only an `app-idea` issue has the form fields to spawn from. This step
      # runs only when that label is missing and does nothing but record why
      # and fail, which hands the run to "Report failure on the issue" below
      # before anything is checked out, parsed or created.
      - name: Require the app-idea label
        id: eligible
        if: ${{ !contains(github.event.issue.labels.*.name, 'app-idea') }}
        run: |
          echo "reason=This issue is not an app idea — it has no \`app-idea\` label, so there is nothing to spawn from it. File the idea with the **App idea** form (\`.github/ISSUE_TEMPLATE/app-idea.yml\`), or add the \`app-idea\` label to this issue, then re-apply \`approved\`." >> "$GITHUB_OUTPUT"
          exit 1

      - uses: actions/checkout@v4

      - name: Parse issue form
        id: fields
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          # Blank when the variable is unset; owners.DEFAULT_OWNER fills in.
          DEFAULT_OWNER: ${{ vars.FACTORY_TARGET_OWNER }}
        run: |
          printf '%s\n' "$ISSUE_BODY" > issue_body.md
          python3 .github/scripts/parse_app_idea.py \
            --body-file issue_body.md \
            --default-owner "$DEFAULT_OWNER" 2> parse.err || {
              { echo "reason<<EOF"; cat parse.err; echo "EOF"; } >> "$GITHUB_OUTPUT"
              cat parse.err
              exit 1
            }

      # A repo that already exists is somebody's work in progress. Say so and
      # stop; never push into it.
      - name: Guard against double-spawn
        id: guard
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PAT || secrets.MONOREPO_PAT }}
          TARGET: ${{ steps.fields.outputs.owner }}/${{ steps.fields.outputs.name }}
        run: |
          if gh api "repos/$TARGET" >/dev/null 2>&1; then
            echo "reason=**${TARGET}** already exists — refusing to overwrite it. Rename the app or delete the existing repo, then re-apply \`approved\`." >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Target $TARGET is free."

      - name: Report failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REASON: ${{ steps.guard.outputs.reason || steps.fields.outputs.reason || steps.eligible.outputs.reason }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "$(printf '%s\n\n%s\n' \
              "❌ App spawn did not run." \
              "${REASON:-See the workflow run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}}")"
          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --remove-label approved

  create:
    needs: parse
    uses: ./.github/workflows/app_create.yml
    with:
      name: ${{ needs.parse.outputs.name }}
      description: ${{ needs.parse.outputs.description }}
      visibility: ${{ needs.parse.outputs.visibility }}
      owner: ${{ needs.parse.outputs.owner }}
      spec: ${{ needs.parse.outputs.spec }}
      source_issue: ${{ github.event.issue.html_url }}
    # Actions cannot resolve a secret by a name held in a variable, so the
    # override is a second optional secret rather than an indirection: set
    # FACTORY_PAT when the target owner needs a different token from the one
    # the monorepo workflows use, otherwise MONOREPO_PAT is it.
    #
    # The RLMS_* trio is the roadmap hand-off, and is optional: unset, they
    # arrive empty and app_create.yml's last step skips itself. They are the
    # same three secrets skills_index.yml already uses against that site.
    secrets:
      FACTORY_PAT: ${{ secrets.FACTORY_PAT || secrets.MONOREPO_PAT }}
      RLMS_SITE_URL: ${{ secrets.RLMS_SITE_URL }}
      RLMS_API_KEY: ${{ secrets.RLMS_API_KEY }}
      RLMS_API_SECRET: ${{ secrets.RLMS_API_SECRET }}

  announce:
    needs: [parse, create]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: ${{ needs.create.outputs.repo_url }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "$(printf '%s\n\n%s\n' \
              "🏗 Spawned **${{ needs.parse.outputs.owner }}/${{ needs.parse.outputs.name }}** → ${REPO_URL}" \
              "The brief is in \`docs/spec.md\` and a **Build v0** issue is open there.")"
          gh issue close ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --reason completed

  # Creation failed after parsing passed (token scope, name taken upstream,
  # push rejected). Leave the issue open and say where to look. The
  # `needs.parse.result == 'success'` half of the condition is what keeps this
  # off a run where `parse` itself failed — an ineligible or unparseable issue
  # has already been commented on and unlabelled by the step above, and would
  # otherwise be told twice.
  report_create_failure:
    needs: [parse, create]
    if: failure() && needs.parse.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment on the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "❌ Repo creation failed for **${{ needs.parse.outputs.owner }}/${{ needs.parse.outputs.name }}**. Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue edit ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --remove-label approved
