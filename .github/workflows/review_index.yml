name: Review Index

# Rebuilds lessons/review_index.json — the machine-readable lesson index the
# Supacharge app reads for the in-app lesson review flow. Runs whenever lesson
# content, job cards, or review-state files change on main.
#
# Loop guards (both, for safety):
#   1. The trigger excludes lessons/review_index.json itself, so the bot
#      commit this workflow makes does not re-trigger it.
#   2. The build script only rewrites the file when content other than
#      generated_at changed, and the commit step is a no-op on no diff.

on:
  push:
    branches:
      - main
    paths:
      - 'lessons/**'
      - '.rokct/agent/jobs/**'
      - '!lessons/review_index.json'
      - '!lessons/knowledge_bites_index.json'
      - '!lessons/practice_bank.json'
      - '!lessons/skills_index.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: review-index
  cancel-in-progress: false

jobs:
  build_index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build review index
        run: python3 lessons/scripts/CAPS/build_review_index.py

      - name: Commit index if changed
        run: |
          if git diff --quiet -- lessons/review_index.json; then
            echo "review_index.json unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons/review_index.json
          git commit -m "[CI] Rebuild lesson review index"
          git push
