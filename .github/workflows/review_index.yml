# Engine copy of factory's review_index.yml: runs against RokctAI/lessons (checked out at the
# workspace root with MONOREPO_PAT). Generated by split/split.py; see split/README.md.
name: Review Index

# Rebuilds school/review_index.json — the machine-readable lesson index the
# Supacharge app reads for the in-app lesson review flow. Runs whenever lesson
# content, job cards, or review-state files change on main.
#
# Loop guards (both, for safety):
#   1. The trigger excludes school/review_index.json itself, so the bot
#      commit this workflow makes does not re-trigger it.
#   2. The build script only rewrites the file when content other than
#      generated_at changed, and the commit step is a no-op on no diff.

on:
  workflow_dispatch:
    inputs:
      router_before:
        description: 'Set by content_router: start of the pushed range. Leave empty when running by hand.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: review-index
  cancel-in-progress: false

jobs:
  build_index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RokctAI/lessons
          token: ${{ secrets.MONOREPO_PAT }}

      - name: Build review index
        run: python3 school/scripts/CAPS/build_review_index.py

      - name: Commit index if changed
        run: |
          if git diff --quiet -- school/review_index.json; then
            echo "review_index.json unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add school/review_index.json
          git commit -m "[CI] Rebuild lesson review index"
          git push
