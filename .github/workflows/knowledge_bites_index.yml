name: Knowledge Bites Index

# Rebuilds lessons/knowledge_bites_index.json — the machine-readable bites
# index behind the Supacharge in-app knowledge-bite offer (decision #52).
# The file is POSTed to the rlms backend's publish_knowledge_bites_index
# endpoint and parsed by lms_sdk's KnowledgeBiteIndex.parse, so it must
# never go stale relative to the bite tree. Runs whenever lesson content
# changes on main. Mirrors review_index.yml.
#
# Loop guards (both, for safety):
#   1. The trigger excludes lessons/knowledge_bites_index.json itself (and
#      lessons/review_index.json, which the Review Index workflow's bot
#      commit touches), so bot commits do not re-trigger this workflow.
#   2. The build script only rewrites the file when content other than
#      generated_at changed, and the commit step is a no-op on no diff.

on:
  push:
    branches:
      - main
    paths:
      - 'lessons/**'
      - '!lessons/knowledge_bites_index.json'
      - '!lessons/review_index.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knowledge-bites-index
  cancel-in-progress: false

jobs:
  build_index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build knowledge bites index
        run: python3 lessons/scripts/build_knowledge_bites_index.py

      - name: Commit index if changed
        run: |
          if git diff --quiet -- lessons/knowledge_bites_index.json; then
            echo "knowledge_bites_index.json unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons/knowledge_bites_index.json
          git commit -m "[CI] Rebuild knowledge bites index"
          git push
