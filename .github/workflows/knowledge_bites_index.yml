# Engine copy of factory's knowledge_bites_index.yml: runs against RokctAI/lessons (checked out at the
# workspace root with MONOREPO_PAT). Generated by split/split.py; see split/README.md.
name: Knowledge Bites Index

# Rebuilds school/knowledge_bites_index.json — the machine-readable bites
# index behind the Supacharge in-app knowledge-bite offer (decision #52).
# The file is POSTed to the rlms backend's publish_knowledge_bites_index
# endpoint and parsed by lms_sdk's KnowledgeBiteIndex.parse, so it must
# never go stale relative to the bite tree. Runs whenever lesson content
# changes on main. Mirrors review_index.yml.
#
# Loop guards (both, for safety):
#   1. The trigger excludes school/knowledge_bites_index.json itself (and
#      school/review_index.json, which the Review Index workflow's bot
#      commit touches), so bot commits do not re-trigger this workflow.
#   2. The build script only rewrites the file when content other than
#      generated_at changed, and the commit step is a no-op on no diff.

on:
  workflow_dispatch:
    inputs:
      router_before:
        description: 'Set by content_router: start of the pushed range. Leave empty when running by hand.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: knowledge-bites-index
  cancel-in-progress: false

jobs:
  build_index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RokctAI/lessons
          token: ${{ secrets.MONOREPO_PAT }}

      - name: Build knowledge bites index
        run: python3 school/scripts/CAPS/build_knowledge_bites_index.py

      - name: Commit index if changed
        run: |
          if git diff --quiet -- school/knowledge_bites_index.json; then
            echo "knowledge_bites_index.json unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add school/knowledge_bites_index.json
          git commit -m "[CI] Rebuild knowledge bites index"
          git push
