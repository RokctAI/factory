name: Lesson 6 - Production (Manim JSON + Audio + Manifest)

# Turns Level-4-approved (`status: evaluated`) lesson cards into the ReplaySDK
# asset triple the app downloads — manifest.json, audio.mp3, animations.json —
# and publishes them as a GitHub Release the backend can serve.
#
# WHY A SCHEDULED CI JOB, NOT A PERSISTENT VPS
# Production is periodic and human-gated (a card only reaches `evaluated`
# after a human approves it at Level 4), so a always-on render server sits
# idle almost all the time. A weekly batch job — the same mechanism as every
# other level here — does the bounded work and stops. See
# docs/level6-manim-ci-production-brief.md and the feasibility note in
# lessons/scripts/README-level6.md.
#
# RUNNER FEASIBILITY (measured, not assumed)
# - Manim JSON export: CPU-only and light. The exporter shims Tex/MathTex to
#   Pango text, so NO TeX distribution is needed — the single heaviest Manim
#   dependency is removed. Runs in seconds on ubuntu-latest.
# - Audio: `sapi` backend (espeak/pyttsx3) is CPU-only and runs here — used to
#   prove the whole loop end to end WITHOUT a GPU. `vibevoice` backend is a
#   ~3B-param BF16 neural TTS that REQUIRES a CUDA GPU (Colab supports only
#   the 1.5B model; there is no practical CPU path). Standard GitHub runners
#   have no GPU, so production audio runs the `vibevoice` backend on a GPU
#   runner (`linux_4_core_gpu`, ~$0.052/min, NVIDIA T4 — fits the 1.5B model's
#   ~6 GB) or an on-demand spot GPU, billed only for the batch's duration.
#   That is still far cheaper than a persistent GPU VPS billed 24/7.

on:
  schedule:
    - cron: '0 2 * * 0'   # Sundays 02:00 UTC — weekly batch
  # Push-dispatch: committing .github/level6_dispatch fires a run with the
  # KEY=VALUE overrides in that file (push events carry no workflow inputs,
  # and this repo's CI is driven by pushes — no authenticated gh available).
  # Scheduled runs never read the file, so leaving it in the tree is safe.
  push:
    paths:
      - '.github/level6_dispatch'
    branches:
      - main
  workflow_dispatch:
    inputs:
      audio_backend:
        description: 'Audio backend: sapi (CPU, no GPU) or vibevoice (needs GPU runner)'
        type: choice
        options: [sapi, vibevoice]
        default: sapi
      max_cards:
        description: 'Max evaluated cards to produce this run'
        default: '5'
      card_filter:
        description: 'Only produce cards whose id contains this substring (e.g. maths). Empty = all.'
        default: ''

# The audio backend defaults to the CPU-only `sapi` path so this workflow runs
# green on a standard runner. For production audio, dispatch with
# audio_backend=vibevoice AND change `runs-on` below to your GPU runner label.
env:
  AUDIO_BACKEND: ${{ github.event.inputs.audio_backend || 'sapi' }}
  MAX_CARDS: ${{ github.event.inputs.max_cards || '5' }}
  CARD_FILTER: ${{ github.event.inputs.card_filter || '' }}

jobs:
  produce_lessons:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest   # production audio: swap for a GPU runner label
    permissions:
      contents: write        # create GitHub Releases + push card updates
    outputs:
      produced_ids: ${{ steps.produce.outputs.produced_ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Initiate Protocol
        run: |
          if [ -f ".rokct/initiate.py" ]; then
            python .rokct/initiate.py
          else
            curl -sSL https://raw.githubusercontent.com/RokctAI/The-Rokct-Protocol/main/profiles/web/initiate.py -o initiate_temp.py
            python initiate_temp.py
            rm initiate_temp.py
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system + Python dependencies
        run: |
          # Manim needs cairo/pango headers; NO texlive (exporter shims Tex).
          # ffmpeg: wav->mp3.  espeak: sapi/pyttsx3 CPU voice fallback.
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config ffmpeg espeak
          pip install manim pyttsx3 requests python-dotenv

      - name: Produce evaluated lessons
        id: produce
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          PRODUCED=""
          COUNT=0

          # Push-dispatch overrides (see the push trigger comment above).
          if [ "${{ github.event_name }}" = "push" ] && [ -f .github/level6_dispatch ]; then
            echo "Push dispatch: loading overrides from .github/level6_dispatch"
            . .github/level6_dispatch
            echo "AUDIO_BACKEND=$AUDIO_BACKEND MAX_CARDS=$MAX_CARDS CARD_FILTER=$CARD_FILTER"
          fi

          # Run report: committed at the end of every run (even no-op ones)
          # because run logs need authenticated API access this project's
          # push-driven tooling doesn't have. Records every skip decision.
          REPORT=".rokct/agent/log/level6_run_report.md"
          {
            echo "# Level 6 run report — run $GITHUB_RUN_ID ($(date -u +'%Y-%m-%d %H:%M:%S') UTC)"
            echo "- event: ${{ github.event_name }}  sha: $GITHUB_SHA"
            echo "- AUDIO_BACKEND=$AUDIO_BACKEND MAX_CARDS=$MAX_CARDS CARD_FILTER=$CARD_FILTER"
            echo "- scaffolds: $(ls .rokct/skills/agent_delegation/scripts/ 2>&1 | tr '\n' ' ')"
            echo "- manim: $(python -c 'import manim; print(manim.__version__)' 2>&1 | tail -1)"
            echo "- pyttsx3: $(python -c 'import pyttsx3; print(1)' 2>&1 | tail -1)"
          } > "$REPORT"
          log_report() { echo "- $1" >> "$REPORT"; }

          for FILE in .rokct/agent/jobs/done/*.md; do
            [ -f "$FILE" ] || continue
            TYPE=$(grep '^type:' "$FILE" | cut -d':' -f2 | xargs)
            case "$TYPE" in lesson.*) ;; *) continue ;; esac
            STATUS=$(grep '^status:' "$FILE" | cut -d':' -f2 | cut -d'#' -f1 | xargs)
            if [ "$STATUS" != "evaluated" ]; then
              log_report "skip $(basename "$FILE"): status='$STATUS'"
              continue
            fi

            if [ "$COUNT" -ge "$MAX_CARDS" ]; then
              echo "Reached MAX_CARDS=$MAX_CARDS; stopping."
              log_report "stop: reached MAX_CARDS=$MAX_CARDS"
              break
            fi

            ID=$(grep '^id:' "$FILE" | cut -d':' -f2 | xargs)
            THEME=$(grep '^theme:' "$FILE" | cut -d':' -f2- | xargs)

            if [ -n "$CARD_FILTER" ] && [[ "$ID" != *"$CARD_FILTER"* ]]; then
              echo "Skipping $ID (does not match card_filter '$CARD_FILTER')."
              log_report "skip $ID: card_filter '$CARD_FILTER' mismatch"
              continue
            fi

            # Claim the job lock so a concurrent run cannot double-produce.
            if ! LOCK_OUT=$(python .rokct/skills/agent_delegation/scripts/lock_job.py --file "$FILE" --action claim --agent "level6" --session "L6-$GITHUB_RUN_ID" 2>&1); then
              echo "Card $FILE lock claim failed; skipping. Output: $LOCK_OUT"
              log_report "skip $ID: lock claim failed: $(echo "$LOCK_OUT" | tail -2 | tr '\n' ' ')"
              continue
            fi

            echo "🎬 Producing $ID (audio backend: $AUDIO_BACKEND)..."
            log_report "producing $ID (backend $AUDIO_BACKEND)"
            python .rokct/skills/agent_delegation/scripts/update_status.py --file "$FILE" --status producing --agent level6

            OUT=".rokct/tmp/level6/$ID"
            rm -rf "$OUT"; mkdir -p "$OUT"

            if ! ASM_OUT=$(python lessons/scripts/lesson_manifest.py --card "$FILE" --out-dir "$OUT" --audio-backend "$AUDIO_BACKEND" 2>&1); then
              echo "❌ Assembly failed for $ID"
              echo "$ASM_OUT" | tail -20
              log_report "FAIL $ID: assembly: $(echo "$ASM_OUT" | tail -3 | tr '\n' ' ')"
              python .rokct/skills/agent_delegation/scripts/update_status.py --file "$FILE" --status failed --agent level6 || true
              python .rokct/skills/agent_delegation/scripts/lock_job.py --file "$FILE" --action release
              continue
            fi
            echo "$ASM_OUT" | tail -5
            log_report "assembled $ID: $(echo "$ASM_OUT" | tail -1)"

            # Validate the manifest against the real ReplaySDK ManifestParser
            # if the replay package is present in the composed workspace; a
            # malformed manifest must never be published.
            if [ -f "agent/replay/dart/tool/validate_manifest.dart" ]; then
              (cd agent/replay/dart && dart run tool/validate_manifest.dart "$GITHUB_WORKSPACE/$OUT/manifest.json") || {
                echo "❌ Manifest failed ManifestParser validation for $ID"
                python .rokct/skills/agent_delegation/scripts/update_status.py --file "$FILE" --status failed --agent level6 || true
                python .rokct/skills/agent_delegation/scripts/lock_job.py --file "$FILE" --action release
                continue
              }
            fi

            # Publish assets as a per-lesson GitHub Release (free, CDN-fronted,
            # durable, direct download URLs — no new infra). Cloudflare R2 is
            # the documented scale-up path once egress volume warrants it.
            TAG="lesson-$ID"
            gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$TAG" --repo "$REPO" \
              --title "Lesson assets: $ID" \
              --notes "Level 6 produced assets (manifest/audio/animations) for $ID." \
              "$OUT/manifest.json" "$OUT/audio.mp3" "$OUT/animations.json"

            BASE="https://github.com/$REPO/releases/download/$TAG"
            python lessons/scripts/record_production.py \
              --card "$FILE" --out-dir "$OUT" --base-url "$BASE"

            python .rokct/skills/agent_delegation/scripts/update_status.py --file "$FILE" --status produced --agent level6
            python .rokct/skills/agent_delegation/scripts/lock_job.py --file "$FILE" --action release

            # Ledger row (same format as ledger_update.yml). Appended here
            # rather than via the reusable single-card job because one Level 6
            # batch can produce several cards; committed with the same push.
            echo "| $ID | $TYPE | $THEME | produced | level6 | L6-$GITHUB_RUN_ID | $BASE/manifest.json | $(date -u +'%Y-%m-%d %H:%M') |" >> .rokct/agent/log/ledger.md

            PRODUCED="$PRODUCED $ID"
            COUNT=$((COUNT + 1))
          done

          echo "produced_ids=$PRODUCED" >> "$GITHUB_OUTPUT"
          log_report "done: produced [$PRODUCED] (count=$COUNT)"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$PRODUCED" ]; then
            git add .rokct/agent/jobs/done/ .rokct/agent/log/transitions.log .rokct/agent/log/ledger.md "$REPORT"
            git commit -m "🤖 [CI] Lesson 6: produced assets for$PRODUCED [skip ci]"
          else
            echo "ℹ️ No evaluated lesson cards to produce."
            git add "$REPORT"
            git commit -m "🤖 [CI] Lesson 6: run report (nothing produced) [skip ci]"
          fi
          for i in 1 2 3; do
            git push origin main && break
            git pull --rebase origin main || { git rebase --abort || true; exit 1; }
            sleep $((RANDOM % 3 + 1))
          done
