name: Lesson 2 - Content Generation
on:
  push:
    paths:
      - '.rokct/agent/jobs/pending/*.md'
    branches:
      - main
  workflow_dispatch:

jobs:
  expand_lesson:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      session_id: ${{ steps.delegate_task.outputs.session_id }}
      card_id: ${{ steps.delegate_task.outputs.card_id }}
      card_type: ${{ steps.delegate_task.outputs.card_type }}
      card_theme: ${{ steps.delegate_task.outputs.card_theme }}
      card_file: ${{ steps.delegate_task.outputs.card_file }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Initiate Protocol
        run: |
          if [ -f ".rokct/initiate.py" ]; then
            echo "🚀 Running local initiate.py..."
            python .rokct/initiate.py
          else
            echo "🌐 Fetching web initiate.py from remote protocol..."
            curl -sSL https://raw.githubusercontent.com/RokctAI/The-Rokct-Protocol/main/profiles/web/initiate.py -o initiate_temp.py
            python initiate_temp.py
            rm initiate_temp.py
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Identify Approved Lesson Plan and Delegate to Jules
        id: delegate_task
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          MONOREPO_PAT: ${{ secrets.MONOREPO_PAT }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            FILES=$(ls .rokct/agent/jobs/pending/*.md 2>/dev/null | grep -v 'template' || true)
          else
            FILES=$(git diff --name-only HEAD~1 HEAD | grep '.rokct/agent/jobs/pending/.*.md' | grep -v 'template' || true)
          fi

          if [ -z "$FILES" ]; then
            echo "ℹ️ No modified job cards found."
          else
            for FILE in $FILES; do
              if [ ! -f "$FILE" ]; then continue; fi

              TYPE=$(grep '^type:' "$FILE" | cut -d':' -f2 | xargs)
              case "$TYPE" in lesson.*) ;; *) continue ;; esac

              ID=$(grep '^id:' "$FILE" | cut -d':' -f2 | xargs)
              THEME=$(grep '^theme:' "$FILE" | cut -d':' -f2- | xargs)
              IDEA_STATUS=$(grep '^idea_status:' "$FILE" | cut -d':' -f2 | xargs)
              STATUS=$(grep '^status:' "$FILE" | cut -d':' -f2 | cut -d'#' -f1 | xargs)

              if [ "$IDEA_STATUS" != "approved" ]; then continue; fi
              if [ "$STATUS" != "pending_approval" ]; then continue; fi

              # Claim Job Lock
              if ! python .rokct/skills/agent_delegation/scripts/lock_job.py --file "$FILE" --action claim --agent "jules" --session "JS-LESSON-$GITHUB_RUN_ID"; then
                echo "Card $FILE is locked by another session. Skipping."
                continue
              fi

              # Set outputs up front so Handle Failure has context
              echo "card_id=$ID" >> "$GITHUB_OUTPUT"
              echo "card_type=$TYPE" >> "$GITHUB_OUTPUT"
              echo "card_theme=$THEME" >> "$GITHUB_OUTPUT"
              echo "card_file=$FILE" >> "$GITHUB_OUTPUT"

              echo "🚀 Delegating Lesson Content Generation for $ID..."

              if ! PROMPT=$(python lessons/scripts/lesson_pipeline.py prompt --file "$FILE" --level 2 2>&1); then
                echo "❌ Prompt construction failed:"
                echo "$PROMPT"
                exit 1
              fi

              if RESULT=$(python .rokct/skills/agent_delegation/scripts/call_jules.py create \
                --repo "sources/github/RokctAI/factory" \
                --prompt "$PROMPT" \
                --title "Lesson 2: Content Generation - $ID" \
                --automation-mode "AUTO_CREATE_PR" 2>&1) && [[ ! "$RESULT" == *"Error:"* ]]; then
                echo "✅ Jules session created."
              else
                REASON=$(echo "$RESULT" | tail -n 6 | tr '\n' ' ' | sed 's/|/\\|/g')
                echo "❌ Jules delegation failed: $REASON"
                mkdir -p .rokct/agent/logs
                echo "| $(date -u +'%Y-%m-%d %H:%M') | Lesson 2: $ID | jules | ❌ FAILED | $GITHUB_RUN_ID | $REASON |" >> .rokct/agent/logs/ai_delegation.md
                git config --global user.name "github-actions[bot]"
                git config --global user.email "github-actions[bot]@users.noreply.github.com"
                git add .rokct/agent/logs/ai_delegation.md
                git commit -m "fail: record Jules delegation error for $ID [skip ci]"
                git push origin main || true
                exit 1
              fi

              # The delegate prints [CI Debug] lines before the JSON payload;
              # strip to the first '{' or jq fails after the session was
              # already created (which spawns duplicate sessions on retry).
              SESSION_ID=$(echo "$RESULT" | sed -n '/^{/,$p' | jq -r '.name // .id // empty' 2>/dev/null | sed 's|.*/||')
              if [ -z "$SESSION_ID" ]; then SESSION_ID="unknown"; fi

              python .rokct/skills/agent_delegation/scripts/update_status.py --file "$FILE" --status concept_expanding --agent jules
              python .rokct/skills/agent_delegation/scripts/lock_job.py --file "$FILE" --action release

              git config --global user.name "github-actions[bot]"
              git config --global user.email "github-actions[bot]@users.noreply.github.com"
              git add "$FILE" .rokct/agent/log/transitions.log
            git add .rokct/agent/log/api_usage.jsonl 2>/dev/null || true
              git commit -m "🤖 [CI] Lesson 2: Content generation delegated for $ID [skip ci]"
              for i in 1 2 3; do
                git push origin main && break
                git pull --rebase origin main || { git rebase --abort || true; exit 1; }
                sleep $((RANDOM % 3 + 1))
              done

              echo "session_id=$SESSION_ID" >> "$GITHUB_OUTPUT"
              break
            done
          fi

      - name: Handle Failure
        if: failure() && steps.delegate_task.outputs.card_file != ''
        run: |
          CARD_FILE="${{ steps.delegate_task.outputs.card_file }}"
          ATTEMPTS=$(grep '^attempts:' "$CARD_FILE" | cut -d':' -f2 | xargs)
          NEW_ATTEMPTS=$((ATTEMPTS + 1))
          sed -i "s/^attempts: .*/attempts: $NEW_ATTEMPTS/" "$CARD_FILE"
          sed -i "s/^last_error: .*/last_error: ${{ github.run_id }} failed at $(date -u)/" "$CARD_FILE"

          echo "[$(date -u +'%Y-%m-%d %H:%M:%S')] ${{ steps.delegate_task.outputs.card_id }} | Lesson 2 | ${{ github.run_id }} | Agent call failed" >> .rokct/agent/log/errors.log

          if [ "$NEW_ATTEMPTS" -ge 3 ]; then
            echo "3 attempts failed. Marking as stalled."
            python .rokct/skills/agent_delegation/scripts/update_status.py \
              --file "$CARD_FILE" \
              --status stalled
          else
            echo "Attempt $NEW_ATTEMPTS failed. Will retry on next push."
            python .rokct/skills/agent_delegation/scripts/lock_job.py \
              --file "$CARD_FILE" \
              --action release
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CARD_FILE" .rokct/agent/log/errors.log
          git commit -m "fail: recorded error for ${{ steps.delegate_task.outputs.card_id }} [skip ci]"
          for i in 1 2 3; do
            git push origin main && break
            git pull --rebase origin main || { git rebase --abort || true; exit 1; }
            sleep $((RANDOM % 3 + 1))
          done

  update_ledger:
    needs: expand_lesson
    if: needs.expand_lesson.outputs.session_id != ''
    uses: ./.github/workflows/ledger_update.yml
    with:
      id: ${{ needs.expand_lesson.outputs.card_id }}
      type: ${{ needs.expand_lesson.outputs.card_type }}
      theme: ${{ needs.expand_lesson.outputs.card_theme }}
      status: "concept_expanding"
      agent: "jules"
      session: ${{ needs.expand_lesson.outputs.session_id }}
    secrets: inherit
