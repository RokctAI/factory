name: Lesson 4 - Evaluation
on:
  push:
    paths:
      - '.rokct/agent/jobs/pending/*.md'
    branches:
      - main
  workflow_dispatch:

jobs:
  evaluate_lesson:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      card_id: ${{ steps.evaluate.outputs.card_id }}
      card_type: ${{ steps.evaluate.outputs.card_type }}
      card_theme: ${{ steps.evaluate.outputs.card_theme }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Initiate Protocol
        run: |
          if [ -f ".rokct/initiate.py" ]; then
            echo "🚀 Running local initiate.py..."
            python .rokct/initiate.py
          else
            echo "🌐 Fetching web initiate.py from remote protocol..."
            curl -sSL https://raw.githubusercontent.com/RokctAI/The-Rokct-Protocol/main/profiles/web/initiate.py -o initiate_temp.py
            python initiate_temp.py
            rm initiate_temp.py
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Evaluate Human-Approved Lessons
        id: evaluate
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            FILES=$(ls .rokct/agent/jobs/pending/*.md 2>/dev/null | grep -v 'template' || true)
          else
            FILES=$(git diff --name-only HEAD~1 HEAD | grep '.rokct/agent/jobs/pending/.*.md' | grep -v 'template' || true)
          fi

          for FILE in $FILES; do
            if [ ! -f "$FILE" ]; then continue; fi

            TYPE=$(grep '^type:' "$FILE" | cut -d':' -f2 | xargs)
            case "$TYPE" in lesson.*) ;; *) continue ;; esac

            STATUS=$(grep '^status:' "$FILE" | cut -d':' -f2 | cut -d'#' -f1 | xargs)
            CONCEPT_STATUS=$(grep '^concept_status:' "$FILE" | cut -d':' -f2 | xargs)

            if [ "$STATUS" != "pending_concept_approval" ]; then continue; fi
            if [ "$CONCEPT_STATUS" != "approved" ]; then continue; fi

            ID=$(grep '^id:' "$FILE" | cut -d':' -f2 | xargs)
            THEME=$(grep '^theme:' "$FILE" | cut -d':' -f2- | xargs)

            if ! python .rokct/skills/agent_delegation/scripts/lock_job.py --file "$FILE" --action claim --agent "system" --session "SYS-LESSON-EVAL-$GITHUB_RUN_ID"; then
              echo "Card $FILE is locked by another session. Skipping."
              continue
            fi

            echo "🏁 Running Level 4 evaluation for $ID..."
            if python lessons/scripts/lesson_pipeline.py evaluate --file "$FILE"; then
              python .rokct/skills/agent_delegation/scripts/update_status.py --file "$FILE" --status evaluated --agent system
              python .rokct/skills/agent_delegation/scripts/lock_job.py --file "$FILE" --action release

              # Evaluated is terminal for this phase: move the card out of the
              # pending queue so Level 0's PENDING_COUNT stays meaningful.
              # The future Level 6 brief picks evaluated cards up from done/.
              git config --global user.name "github-actions[bot]"
              git config --global user.email "github-actions[bot]@users.noreply.github.com"
              git mv "$FILE" ".rokct/agent/jobs/done/$(basename "$FILE")"
              git add .rokct/agent/log/transitions.log
              git commit -m "🤖 [CI] Lesson 4: Evaluated (Level 4 approved) $ID [skip ci]"
              for i in 1 2 3; do
                git push origin main && break
                git pull --rebase origin main || { git rebase --abort || true; exit 1; }
                sleep $((RANDOM % 3 + 1))
              done

              echo "card_id=$ID" >> "$GITHUB_OUTPUT"
              echo "card_type=$TYPE" >> "$GITHUB_OUTPUT"
              echo "card_theme=$THEME" >> "$GITHUB_OUTPUT"
            else
              echo "❌ Level 4 evaluation failed for $ID."
              python .rokct/skills/agent_delegation/scripts/lock_job.py --file "$FILE" --action release
              exit 1
            fi
            break
          done

  update_ledger:
    needs: evaluate_lesson
    if: needs.evaluate_lesson.outputs.card_id != ''
    uses: ./.github/workflows/ledger_update.yml
    with:
      id: ${{ needs.evaluate_lesson.outputs.card_id }}
      type: ${{ needs.evaluate_lesson.outputs.card_type }}
      theme: ${{ needs.evaluate_lesson.outputs.card_theme }}
      status: "evaluated"
      agent: "system"
      session: "SYS-LESSON-EVAL-${{ github.run_id }}"
    secrets: inherit
